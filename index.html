<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZestFlix - The Ultimate Streamer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

        /* ═══════════════════════════════════════════════════
           VARIABLES
        ═══════════════════════════════════════════════════ */
        :root {
            --bg-deep: #5C4033;
            --nav-bg: rgba(253, 245, 230, 0.95);
            --panel-bg: rgba(253, 245, 230, 0.9);
            --accent-primary: #D4A373;
            --accent-secondary: #7FA998;
            --accent-hover: #E6CCB2;
            --accent-ai: #6E9B85;
            --danger: #D96C6C;
            --input-bg: #FFFFFF;
            --border-color: #A67B5B;
            --frame-color: #3E2723;
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            --bubbly-radius: 30px;
            --card-radius: 20px;
            --shadow-3d: 0 4px 0 rgba(62, 39, 35, 0.15);
            --shadow-float: 0 10px 25px rgba(62, 39, 35, 0.2);
            --max-layout-width: 1600px;
        }

        /* ── MOVIE THEME ── */
        body.movie-mode {
            --bg-deep: #0a0e1a;
            --nav-bg: rgba(8, 14, 32, 0.95);
            --panel-bg: rgba(8, 14, 32, 0.88);
            --accent-primary: #4a6fa5;
            --accent-secondary: #2d4a7a;
            --accent-hover: #1e3560;
            --accent-ai: #4a6fa5;
            --border-color: #2a4080;
            --frame-color: #050a15;
            --text-main: #e8eaf6;
            --text-muted: #7986cb;
            --shadow-3d: 0 4px 0 rgba(0, 10, 40, 0.4);
            --shadow-float: 0 10px 30px rgba(0, 20, 80, 0.5);
        }

        /* Theme Overrides */
        body.movie-mode .cozy-overlay { background: radial-gradient(ellipse at 50% 30%, rgba(74,111,165,0.18) 0%, rgba(5,10,25,0.97) 100%) !important; }
        body.movie-mode .background-backdrop { filter: blur(40px) brightness(0.3) saturate(0.4) !important; }
        body.movie-mode .show-overview { border-left-color: #4a6fa5; background: rgba(74,111,165,0.1); }
        body.movie-mode .library-section { background: rgba(8,14,32,0.7); border-color: #2a4080; }
        body.movie-mode .badge { background: rgba(74,111,165,0.15); color: #a0b8e8; }
        body.movie-mode .badge.rating { background: rgba(106,90,205,0.18); color: #9fa8da; }
        body.movie-mode .dropdown-header { background-color: #2d4a7a; border-color: #3a5a9a; }
        body.movie-mode .search-results { background: rgba(8,14,32,0.98); border-color: #2a4080; }
        body.movie-mode .search-item:hover { background: rgba(74,111,165,0.2); }
        body.movie-mode .cinema-fx { display: block !important; }
        body.movie-mode .zesty-msg-bot { background: #0e1830; border-color: #2a4080; color: #c5cae9; }
        body.movie-mode .zesty-header { background: #1a2d5a; }
        body.movie-mode .zesty-panel { background: #080e20; border-color: #2a4080; }
        body.movie-mode input, body.movie-mode .action-btn { background: #0e1830; border-color: #2a4080; color: #e8eaf6; }
        body.movie-mode input::placeholder { color: #7986cb; }
        body.movie-mode .ai-insights-panel { background: rgba(74,111,165,0.15); border-color: #2a4080; }
        body.movie-mode .show-info { background: rgba(8,14,32,0.88); border-color: #2a4080; }
        body.movie-mode .navbar { background: rgba(8,14,32,0.95); border-color: #2a4080; }
        body.movie-mode .library-title { color: #c5cae9; }
        body.movie-mode .empty-library { color: #7986cb; }
        body.movie-mode .library-card { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .library-card-title { color: #c5cae9; }
        body.movie-mode .dropdown-list { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .dropdown-item:hover, body.movie-mode .dropdown-item.selected { background: rgba(74,111,165,0.25); color: #fff; }

        /* ═══════════════════════════════════════════════════
           ANIMATIONS & DYNAMIC STARS
        ═══════════════════════════════════════════════════ */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(110, 155, 133, 0.3), var(--shadow-3d); }
            50% { box-shadow: 0 0 20px rgba(110, 155, 133, 0.7), var(--shadow-3d); }
        }
        body.movie-mode @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(74, 111, 165, 0.3), var(--shadow-3d); }
            50% { box-shadow: 0 0 20px rgba(74, 111, 165, 0.7), var(--shadow-3d); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(-6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes sweep {
            0% { transform: translateX(-50%) rotate(-8deg); opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { transform: translateX(-50%) rotate(8deg); opacity: 0.3; }
        }
        @keyframes drift {
            from { transform: translateY(0px) translateX(0px); }
            to { transform: translateY(-50px) translateX(20px); }
        }

        /* ═══════════════════════════════════════════════════
           BASE ELEMENTS
        ═══════════════════════════════════════════════════ */
        * {
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: 'Nunito', system-ui, sans-serif;
            -webkit-user-select: none; 
            -moz-user-select: none; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-deep); 
            color: var(--text-main);
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow-x: hidden; 
            overflow-y: auto; 
            font-size: 16px;
            overscroll-behavior: none;
            transition: background-color 0.8s ease, color 0.6s ease;
        }

        body.chat-open { overflow: hidden !important; }

        /* Background Effects */
        .cinema-fx {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .cinema-beam {
            position: absolute; top: -30%; left: 50%;
            width: 200vw; height: 150vh;
            background: conic-gradient(from 180deg at 50% 0%, rgba(74,111,165,0.08) 0deg, transparent 35deg, transparent 325deg, rgba(74,111,165,0.08) 360deg);
            transform-origin: top center;
            animation: sweep 12s infinite alternate ease-in-out;
        }
        
        /* Dynamic Stars Layer */
        .cinema-stars {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: transparent; z-index: 1;
            animation: drift 60s linear infinite alternate;
        }
        .cinema-stars::after {
            content: ''; position: absolute; width: 2px; height: 2px; background: transparent;
            /* Generating a big starfield using box-shadow */
            box-shadow: 10vw 20vh #fff, 40vw 60vh #fff, 80vw 10vh #fff, 20vw 80vh #fff, 50vw 50vh #fff, 90vw 90vh #fff, 70vw 30vh #fff, 30vw 40vh #fff, 15vw 70vh #fff, 85vw 60vh rgba(255,255,255,0.6), 5vw 90vh #fff, 35vw 15vh #fff, 65vw 85vh #fff, 95vw 25vh rgba(255,255,255,0.8), 25vw 55vh #fff, 55vw 5vh #fff, 75vw 75vh #fff, 45vw 35vh rgba(255,255,255,0.5), 10vw 45vh #fff, 80vw 45vh #fff;
            animation: pulseGlow 4s infinite alternate;
        }

        .background-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-size: cover; background-position: center;
            filter: blur(30px) brightness(0.8) sepia(0.3);
            transition: background-image 1s ease-in-out, filter 0.8s ease; 
            transform: scale(1.1);
        }
        .cozy-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(212,163,115,0.3) 0%, rgba(92,64,51,0.95) 100%);
            pointer-events: none; transition: background 0.8s ease;
        }

        /* ═══════════════════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════════════════ */
        .main-content { 
            flex: 1; 
            padding-bottom: 50px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 24px; 
            width: 100%; 
        }
        .navbar, .show-info, .library-section {
            width: 95%; 
            max-width: var(--max-layout-width); 
            margin: 14px auto;
        }

        /* Navbar */
        .navbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 12px 24px; 
            background-color: var(--nav-bg);
            backdrop-filter: blur(20px); 
            border: 3px solid var(--border-color);
            border-radius: var(--bubbly-radius); 
            box-shadow: var(--shadow-float), var(--shadow-3d);
            z-index: 100; 
            flex-wrap: nowrap; 
            gap: 20px;
            transition: background 0.8s ease, border-color 0.6s ease;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
        .nav-right { flex: 2; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
        .logo { font-size: 34px; font-weight: 700; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; gap: 4px; }

        /* Inputs & Buttons */
        input, textarea {
            background-color: var(--input-bg); 
            color: var(--text-main);
            border: 3px solid var(--border-color); 
            padding: 9px 18px;
            border-radius: var(--bubbly-radius); 
            outline: none;
            font-size: 16px !important; 
            font-weight: 800;
            transition: all 0.3s;
            box-shadow: var(--shadow-3d); 
            cursor: text; 
            touch-action: manipulation;
            -webkit-user-select: text !important; 
            user-select: text !important;
            width: 100%;
        }
        input::placeholder { color: #A1887F; transition: color 0.3s; }
        input.ai-mode { border-color: var(--accent-ai); box-shadow: 0 0 14px rgba(110,155,133,0.3), var(--shadow-3d); }
        body.movie-mode input.ai-mode { box-shadow: 0 0 14px rgba(74,111,165,0.3), var(--shadow-3d); }

        .action-btn {
            background-color: var(--accent-hover); 
            color: var(--text-main);
            border: 3px solid var(--border-color); 
            padding: 9px 18px;
            border-radius: var(--bubbly-radius); 
            outline: none;
            font-size: 16px !important; 
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-3d); 
            cursor: pointer; 
            touch-action: manipulation;
            white-space: nowrap; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(62,39,35,0.18); }
        .action-btn:active { transform: translateY(1px); }
        .action-btn.active-fav { background-color: var(--danger); border-color: #B25858; color: white; }

        /* Search Section - Smaller AI Button */
        .search-container { position: relative; width: 100%; max-width: 620px; display: flex; align-items: center; gap: 8px; flex-grow: 1; }
        .search-input-wrapper { position: relative; flex: 1; }
        .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
        
        .ai-search-area {
            display: flex; align-items: center; gap: 6px;
            background: var(--nav-bg); border: 2px solid var(--border-color);
            border-radius: 20px; padding: 4px 10px;
            box-shadow: var(--shadow-3d); transition: all 0.3s; cursor: pointer;
            flex-shrink: 0; white-space: nowrap;
        }
        .ai-search-area.active { border-color: var(--accent-ai); animation: pulseGlow 2.5s infinite; }
        .ai-search-icon { font-size: 16px; transition: transform 0.3s; }
        .ai-search-area.active .ai-search-icon { transform: scale(1.15); }
        .ai-search-label { font-size: 12px; font-weight: 900; color: var(--text-muted); }
        .ai-search-area.active .ai-search-label { color: var(--accent-ai); }

        .search-results {
            position: absolute; top: calc(100% + 10px); left: 0; width: 100%;
            background-color: var(--nav-bg); border: 3px solid var(--border-color);
            border-radius: var(--card-radius); box-shadow: var(--shadow-float);
            z-index: 200; display: none; flex-direction: column; padding: 8px;
        }
        .search-results.active { display: flex; animation: popIn 0.2s forwards; }
        .search-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .search-item:hover { background: var(--accent-hover); }
        .search-item img { width: 36px; height: 52px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #ddd; }
        .search-item b { font-size: 14px; font-weight: 800; color: var(--text-main); }
        .search-item small { font-size: 12px; color: var(--text-muted); font-weight: 700; }

        /* Dropdowns */
        .dropdown-container { display: flex; gap: 10px; align-items: center; }
        .custom-dropdown { position: relative; min-width: 140px; }
        .dropdown-header {
            background-color: var(--accent-secondary); color: white; border: 3px solid var(--border-color);
            padding: 9px 16px; border-radius: var(--bubbly-radius); font-size: 15px; font-weight: 800;
            font-family: 'Fredoka', sans-serif; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; transition: all 0.3s; box-shadow: var(--shadow-3d);
        }
        .dropdown-header:hover { transform: translateY(-2px); }
        .dropdown-header.disabled { opacity: 0.55; pointer-events: none; filter: grayscale(0.5); }
        .dropdown-list {
            position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: var(--nav-bg);
            border: 3px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-float);
            max-height: 260px; overflow-y: auto; z-index: 300; display: none; flex-direction: column; padding: 8px;
        }
        .dropdown-list.show { display: flex; animation: popIn 0.2s forwards; }
        .dropdown-item { 
            padding: 10px 14px; border-radius: 12px; cursor: pointer; 
            font-weight: 900; font-size: 14px; color: var(--text-main); 
        }
        .dropdown-item:hover, .dropdown-item.selected { background-color: var(--accent-hover); transform: translateX(4px); }

        /* Player Frame - Bigger & Thicker Desktop */
        .iframe-wrapper {
            width: 95%; max-width: var(--max-layout-width);
            aspect-ratio: 16 / 9;
            position: relative; background: var(--frame-color);
            border: 20px solid #4E342E;
            outline: 6px solid #2D1B15;
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 0 0 4px #1a0e0a, var(--shadow-float), inset 0 0 50px rgba(0,0,0,0.85);
            margin-top: 14px;
            transition: border-color 0.8s ease, box-shadow 0.8s ease;
        }
        body.movie-mode .iframe-wrapper {
            border-color: #1a2d5a;
            outline-color: #0a1428;
            box-shadow: 0 0 0 4px #050a14, 0 0 60px rgba(74,111,165,0.3), inset 0 0 60px rgba(0,0,0,0.9);
        }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* ═══════════════════════════════════════════════════
           AD SUPPRESSION SYSTEM
        ═══════════════════════════════════════════════════ */
        /* Kill layer: sits above iframe, transparent, intercepts ad popup clicks */
        #ad-kill-overlay {
            display: none; /* activated by JS on ad detection */
            position: absolute; inset: 0; z-index: 99;
            background: transparent; pointer-events: none;
        }
        /* Block any injected ad iframes that appear as siblings/children of the wrapper */
        .iframe-wrapper > iframe:not(#player-frame) { display: none !important; }
        /* Generic ad container patterns that might get injected into the page DOM */
        [id*="ad"], [id*="Ad"], [id*="AD"],
        [class*="ad-"], [class*="-ad"], [class*="ads-"],
        [class*="advert"], [class*="banner-ad"],
        [class*="popup"], [class*="pop-up"], [class*="popunder"],
        [class*="overlay-ad"], [class*="interstitial"],
        iframe[src*="doubleclick"], iframe[src*="googlesyndication"],
        iframe[src*="adnxs"], iframe[src*="ads."], iframe[src*="ad."],
        div[id^="google_ads"], ins.adsbygoogle,
        [data-ad], [data-ads], [data-advertisement] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
            overflow: hidden !important;
        }
        /* Block fixed/absolute overlays that ads use to hijack clicks */
        body > div[style*="position: fixed"][style*="z-index"],
        body > div[style*="position:fixed"][style*="z-index"] {
            pointer-events: none !important;
        }

        /* Library & Cards */
        .library-section {
            padding: 24px 30px; background: rgba(253,245,230,0.7);
            backdrop-filter: blur(10px); border-radius: var(--card-radius);
            border: 3px dashed var(--border-color);
            transition: background 0.8s ease, border-color 0.6s ease;
        }
        .library-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 2px; }
        .library-title { font-size: 36px; font-weight: 700; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; gap: 12px; color: var(--text-main); transition: color 0.6s; }
        
        /* New Sleek AI Picks Button */
        .ai-text-btn {
            background: transparent; border: none; color: var(--accent-secondary); 
            font-size: 16px; font-weight: 800; cursor: pointer; display: flex; 
            align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px;
            transition: background 0.2s, transform 0.2s;
        }
        body.movie-mode .ai-text-btn { color: var(--accent-primary); }
        .ai-text-btn:hover { background: rgba(127, 169, 152, 0.15); transform: translateY(-1px); }
        body.movie-mode .ai-text-btn:hover { background: rgba(74, 111, 165, 0.15); }

        .library-scroll { display: flex; gap: 16px; overflow-x: auto; padding: 16px 4px 24px 4px; scroll-behavior: smooth; }
        .library-scroll::-webkit-scrollbar { height: 5px; }
        .library-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .library-card {
            min-width: 150px; max-width: 150px; position: relative; display: flex;
            flex-direction: column; cursor: pointer;
            background: linear-gradient(160deg, #f5ece0, #e8d8c4);
            border-radius: 14px;
            border: 3px solid var(--border-color);
            padding: 0; box-shadow: 0 5px 12px rgba(62,39,35,0.18), 0 2px 4px rgba(139,94,60,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            flex-shrink: 0; overflow: hidden;
        }
        body.movie-mode .library-card { background: linear-gradient(160deg, #0e1a35, #1a2d50); border-color: #2a4080; }
        .library-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(62,39,35,0.25); }
        .library-card.is-favorite { border-color: var(--danger); box-shadow: 0 5px 12px rgba(217,108,108,0.3); }
        
        .card-img-wrapper { position: relative; width: 100%; height: 200px; overflow: hidden; background: #d5c4b0; }
        body.movie-mode .card-img-wrapper { background: #0a1428; }
        .library-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .library-card-title {
            font-size: 13px; font-weight: 900; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding: 10px 10px 6px;
            font-family: 'Fredoka', sans-serif; color: #5C3317;
            background: linear-gradient(180deg, #f5ece0, #e8d2b8);
            border-top: 2px solid #c4a06e; letter-spacing: 0.3px;
        }
        body.movie-mode .library-card-title { color: #a0b8e8; background: linear-gradient(180deg, #0e1a35, #0a1428); border-top-color: #1e3560; }

        .fav-badge { position: absolute; top: 5px; left: 5px; font-size: 14px; z-index: 5; background: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .progress-badge {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(92,51,23,0.88); color: #f5ddb0;
            font-size: 11px; font-weight: 900; padding: 5px 6px;
            text-align: center; font-family: 'Fredoka', sans-serif;
            letter-spacing: 0.5px; border-top: 1.5px solid rgba(212,160,110,0.4);
        }
        .progress-badge.is-movie { background: rgba(25,40,90,0.9); color: #9fc3ff; border-top-color: rgba(74,111,165,0.4); }
        body:not(.movie-mode) .progress-badge.is-movie { background: rgba(62,39,35,0.85); color: #e8ccaa; }
        
        .remove-btn { 
            position: absolute; top: 6px; right: 6px; 
            background: rgba(0,0,0,0.6); color: white; width: 24px; height: 24px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 14px; border: 1.5px solid rgba(255,255,255,0.4); 
            backdrop-filter: blur(4px); opacity: 0; transition: all 0.2s; z-index: 20; cursor: pointer; 
        }
        .library-card:hover .remove-btn { opacity: 1; }
        .remove-btn:hover { background: var(--danger); transform: scale(1.1); border-color: white; }
        
        .empty-library { padding: 20px 6px; font-weight: 800; color: var(--text-muted); font-size: 16px; }
        .ai-recs-section { margin-top: 18px; padding-top: 16px; border-top: 2px dashed rgba(160,147,166,0.4); }
        .ai-recs-title { font-size: 18px; font-weight: 900; margin-bottom: 2px; padding-left: 4px; color: var(--text-main); }

        /* Show Info Box */
        .show-info {
            padding: 30px 34px; background: var(--panel-bg); backdrop-filter: blur(16px);
            border-radius: var(--card-radius); border: 3px solid var(--border-color);
            box-shadow: var(--shadow-float); display: flex; flex-direction: column; gap: 18px;
            transition: background 0.8s ease, border-color 0.6s ease;
        }

function mdToHtml(raw) {
    if (!raw) return '';
    
    let formattedText = raw
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
        
    const lines = formattedText.split('\n');
    let html = '';
    let inList = false;
    
    for (const line of lines) {
        const bulletMatch = line.match(/^[\*\-]\s+(.+)/);
        
        if (bulletMatch) {
            if (!inList) { 
                html += '<ul style="padding-left:18px; margin:8px 0;">'; 
                inList = true; 
            }
            html += `<li style="margin-bottom:5px;">${bulletMatch[1]}</li>`;
        } else {
            if (inList) { 
                html += '</ul>'; 
                inList = false; 
            }
            if (line.trim()) {
                html += `<p style="margin-bottom:8px;">${line.trim()}</p>`;
            }
        }
    }
    
    if (inList) html += '</ul>';
    return html;
}

                        messages: msgs,

                    })
                });
                
                if (!res.ok) throw new Error('API Request Failed');
                
                const data = await res.json();
                return data.choices[0].message.content.trim();
                
            } catch (err) {
                if (i === retries) return null; 
                await new Promise(r => setTimeout(r, 1000 * (i + 1)));

/* ═══════════════════════════════════════════════════
   LIBRARY / BACKPACK
═══════════════════════════════════════════════════ */
function getLib() {
    return JSON.parse(localStorage.getItem('streamToyLibrary') || '[]');
}

function saveLib(libArray) { 
    localStorage.setItem('streamToyLibrary', JSON.stringify(libArray)); 
    renderLib(); 
    updateFavUI(); 
}

function upsertLib(data, type, season = 1, episode = 1) {
    let lib = getLib();
    const existingItem = lib.find(item => item.id == data.id && item.mediaType === type);
    const isFav = existingItem ? existingItem.favorite : false;
    
    lib = lib.filter(item => !(item.id == data.id && item.mediaType === type));
    lib.unshift({ 
        id: data.id, name: data.name || data.title, poster: data.poster_path, 
        mediaType: type, season: season, episode: episode, favorite: isFav 
    });
    if (lib.length > 20) lib.pop();
    saveLib(lib);
}

function updateProgress(id, season, episode) {
    if (mediaType === 'movie') return;
    let lib = getLib(); 
    const itemIndex = lib.findIndex(x => x.id == id && x.mediaType === 'tv');
    if (itemIndex !== -1 && (lib[itemIndex].season != season || lib[itemIndex].episode != episode)) { 
        lib[itemIndex].season = season; 
        lib[itemIndex].episode = episode; 
        saveLib(lib); 
        if (id == mediaId) {
            seasonVal = season; episodeVal = episode;
            seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`;
            episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`;
        }
    }
}

function toggleFav(id) {
    let lib = getLib(); 
    const itemIndex = lib.findIndex(x => x.id == id && x.mediaType === mediaType);
    if (itemIndex !== -1) { lib[itemIndex].favorite = !lib[itemIndex].favorite; saveLib(lib); }
}

function updateFavUI() {
    const currentItem = getLib().find(i => i.id == mediaId && i.mediaType == mediaType);
    if (currentItem?.favorite) { 
        favBtn.innerHTML = '<span class="emoji-icon" style="color:#ef4444;">❤️</span> Favorited'; 
        favBtn.classList.add('active-fav'); 
    } else { 
        favBtn.innerHTML = '<span class="emoji-icon">🤍</span> Favorite'; 
        favBtn.classList.remove('active-fav'); 
    }
}

function renderLib() {
    let lib = getLib(); 
    libraryScroll.innerHTML = '';
    
    if (!lib.length) { 
        libraryScroll.innerHTML = '<div class="empty-library">Your backpack is empty! 🏕️ Search something to start.</div>'; 
        return; 
    }
    
    lib.sort((a, b) => (b.favorite === true) - (a.favorite === true));
    lib.forEach(item => {
        const card = document.createElement('div');
        card.className = `library-card ${item.favorite ? 'is-favorite' : ''}`;
        
        const posterUrl = item.poster ? `https://image.tmdb.org/t/p/w200${item.poster}` : '';
        const favBadge = item.favorite ? '<div class="fav-badge">❤️</div>' : '';
        const progBadge = item.mediaType === 'movie' ? 
            `<div class="progress-badge is-movie">🎬 FILM</div>` : 
            `<div class="progress-badge">S${item.season || 1} · E${item.episode || 1}</div>`;
            
        card.innerHTML = `
            <div class="remove-btn" title="Remove">✕</div>
            <div class="card-img-wrapper">${favBadge}<img src="${posterUrl}" alt="" loading="lazy">${progBadge}</div>
            <div class="library-card-title">${item.name}</div>
        `;
        
        card.querySelector('.remove-btn').addEventListener('click', e => { 
            e.stopPropagation(); 
            let currentLib = getLib(); 
            currentLib = currentLib.filter(i => !(i.id == item.id && i.mediaType === item.mediaType)); 
            saveLib(currentLib); 
        });
        
        card.addEventListener('click', () => { 
            mediaId = item.id; mediaType = item.mediaType; 
            manualThemeOverride = null; // reset user manual theme on new load
            loadMedia(item.id, item.mediaType, item.season, item.episode); 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        });
        
        libraryScroll.appendChild(card);
    });
}

/* ═══════════════════════════════════════════════════
   PLAYER & SEARCH
═══════════════════════════════════════════════════ */
function updatePlayer() {
    const themeColor = mediaType === 'movie' ? '4a6fa5' : 'D4A373';
    if (mediaType === 'movie') {
        playerFrame.src = `https://www.vidking.net/embed/movie/${mediaId}?color=${themeColor}&autoPlay=true`;
    } else {
        playerFrame.src = `https://www.vidking.net/embed/tv/${mediaId}/${seasonVal}/${episodeVal}?color=${themeColor}&autoPlay=true&nextEpisode=true&episodeSelector=true`;
        updateProgress(mediaId, seasonVal, episodeVal); 
    }
}

window.addEventListener("message", function (event) {
    try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data && data.type === "PLAYER_EVENT" && data.data) {
            const payload = data.data;
            if (payload.mediaType === 'tv' && payload.season && payload.episode) {
                updateProgress(payload.id, payload.season, payload.episode);
            }
        }
    } catch(e) {}
});

searchInput.addEventListener('input', async e => {
    clearTimeout(searchTimer);
    const query = e.target.value.trim();
    if (query.length < 2) { searchResults.classList.remove('active'); return; }

    searchTimer = setTimeout(async () => {
        try {
            const finalQuery = aiSearchOn ? await AI.smartSearch(query) : query;
            const data = await TMDB.searchMulti(finalQuery);
            searchResults.innerHTML = '';
            const validResults = data.results?.filter(i => i.media_type !== 'person').slice(0, 6) || [];
            
            validResults.forEach(item => {
                const el = document.createElement('div'); el.className = 'search-item';
                const imgUrl = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : '';
                const year = (item.first_air_date || item.release_date || '').slice(0, 4);
                const typeLabel = item.media_type === 'movie' ? '🎬 Movie' : '📺 TV';
                
                el.innerHTML = `<img src="${imgUrl}" alt=""><div><b>${item.name || item.title}</b><br><small>${typeLabel}${year ? ' · ' + year : ''}</small></div>`;
                el.onclick = () => { 
                    searchInput.value = ''; searchResults.classList.remove('active'); 
                    manualThemeOverride = null; // reset manual theme
                    loadMedia(item.id, item.media_type); 
                };
                searchResults.appendChild(el);
            });
            searchResults.classList.add('active');
            if (!validResults.length) searchResults.innerHTML = `<div class="search-item"><b>No results found.</b></div>`;
        } catch (err) {}
    }, aiSearchOn ? 700 : 380);
});

/* ═══════════════════════════════════════════════════
   DROPDOWNS & DATA LOADING
═══════════════════════════════════════════════════ */
function toggleDD(listElement) {
    if (listElement !== seasonList) seasonList.classList.remove('show');
    if (listElement !== episodeList) episodeList.classList.remove('show');
    listElement.classList.toggle('show');
}
seasonHeader.addEventListener('click', () => { if (!seasonHeader.classList.contains('disabled')) toggleDD(seasonList); });
episodeHeader.addEventListener('click', () => { if (!episodeHeader.classList.contains('disabled')) toggleDD(episodeList); });

document.addEventListener('click', e => {
    if (!e.target.closest('.custom-dropdown')) { seasonList.classList.remove('show'); episodeList.classList.remove('show'); }
    if (!e.target.closest('.search-container')) searchResults.classList.remove('active');
});

function buildSeasonDD(seasons, targetSeason) {
    seasonList.innerHTML = '';
    seasons.forEach(season => {
        const el = document.createElement('div'); el.className = 'dropdown-item';
        el.textContent = `Season ${season.season_number}`;
        if (season.season_number == targetSeason) el.classList.add('selected');
        
        el.onclick = () => { 
            seasonVal = season.season_number; seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`; 
            seasonList.classList.remove('show'); loadEpisodes(mediaId, seasonVal); 
        };
        seasonList.appendChild(el);
    });
    seasonHeader.classList.remove('disabled');
}

function buildEpisodeDD(episodes, targetEpisode) {
    episodeList.innerHTML = '';
    episodes.forEach(ep => {
        const el = document.createElement('div'); el.className = 'dropdown-item';
        const truncatedName = ep.name.length > 24 ? ep.name.slice(0, 24) + '…' : ep.name;
        el.textContent = `Ep ${ep.episode_number}: ${truncatedName}`;
        if (ep.episode_number == targetEpisode) el.classList.add('selected');
        
        el.onclick = () => { 
            episodeVal = ep.episode_number; episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`; 
            episodeList.classList.remove('show'); updatePlayer(); 
        };
        episodeList.appendChild(el);
    });
    episodeHeader.classList.remove('disabled');
}

async function loadEpisodes(tvId, seasonNum, targetEp = null) {
    const data = await TMDB.getEpisodes(tvId, seasonNum);
    if (data.episodes?.length) {
        episodeVal = targetEp || data.episodes[0].episode_number;
        episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`;
        buildEpisodeDD(data.episodes, episodeVal); 
        updatePlayer();
    }
}

function truncateOverview(text) {
    const maxLength = 160;
    if (!text) return 'No story available.';
    if (text.length <= maxLength) return text;
    return `<span class="short-desc">${text.slice(0, maxLength)}...</span><span class="full-desc" style="display:none;">${text}</span><a href="#" class="read-more-btn">Read More</a>`;
}

// Background AI Insights function
async function triggerAutoInsights(title, type, year) {
    aiInsightsPanel.innerHTML = '<div class="insights-loader"><span class="emoji-icon">✨</span> Gathering Zesty Intel...</div>';
    aiInsightsPanel.classList.add('visible');
    
    const rawInsights = await AI.insights(title, type === 'tv' ? 'TV Show' : 'Movie', year);
    
    // Check if user navigated away while loading
    if (title !== mediaTitle) return; 

    aiInsightsPanel.innerHTML = `
        <span class="close-insights" onclick="this.parentElement.classList.remove('visible')" title="Close">✕</span>
        ${mdToHtml(rawInsights)}
    `;
}

async function loadMedia(id, type, targetSeason = null, targetEpisode = null) {
    mediaId = id; mediaType = type;
    
    try {
        applyTheme(manualThemeOverride || type);
        const details = await TMDB.getDetails(id, type);
        upsertLib(details, type, targetSeason || 1, targetEpisode || 1);

        if (details.backdrop_path && window.innerWidth > 768) {
            bgBackdrop.style.backgroundImage = `url(https://image.tmdb.org/t/p/original${details.backdrop_path})`;
        }

        mediaTitle = details.name || details.title;
        const releaseDate = details.first_air_date || details.release_date; 
        mediaYear = releaseDate ? releaseDate.slice(0, 4) : 'N/A';
        
        infoTitle.textContent = mediaTitle;
        infoType.innerHTML = `<span class="emoji-icon">${type === 'movie' ? '🎬' : '📺'}</span> ${type === 'movie' ? 'Movie' : 'TV Show'}`;
        infoYear.innerHTML = `<span class="emoji-icon">📅</span> ${mediaYear}`;
        infoRating.innerHTML = `<span class="emoji-icon">⭐</span> ${details.vote_average?.toFixed(1) || 'N/A'}`;
        
        infoOverview.innerHTML = truncateOverview(details.overview);
        const readBtn = infoOverview.querySelector('.read-more-btn');
        if (readBtn) {
            readBtn.addEventListener('click', e => {
                e.preventDefault();
                const isShort = infoOverview.querySelector('.full-desc').style.display === 'none';
                infoOverview.querySelector('.short-desc').style.display = isShort ? 'none' : 'inline';
                infoOverview.querySelector('.full-desc').style.display = isShort ? 'inline' : 'none';
                e.target.textContent = isShort ? ' Show Less' : ' Read More';
            });
        }

        document.querySelectorAll('.genre-badge').forEach(e => e.remove());
        details.genres?.slice(0, 3).forEach(genre => {
            const span = document.createElement('span'); span.className = 'badge genre-badge';
            span.innerHTML = `<span class="emoji-icon">🎭</span> ${genre.name}`;
            badgesRow.appendChild(span);
        });

        if (type === 'movie') { 
            $('dropdown-group').style.display = 'none'; updatePlayer(); 
        } else {
            $('dropdown-group').style.display = 'flex';
            const validSeasons = details.seasons?.filter(s => s.season_number > 0) || [];
            if (validSeasons.length) {
                seasonVal = targetSeason || validSeasons[0].season_number;
                seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`;
                buildSeasonDD(validSeasons, seasonVal);
                await loadEpisodes(id, seasonVal, targetEpisode);
            }
        }
        
        updateFavUI();
        triggerAutoInsights(mediaTitle, mediaType, mediaYear); // Call background AI insights automatically
        
    } catch(e) { console.error('loadMedia Error:', e); }
}

aiRecsBtn.addEventListener('click', async () => {
    if (aiRecsContainer.style.display === 'block') { aiRecsContainer.style.display = 'none'; return; }
    
    const lib = getLib();
    if (!lib.length) { alert('Add something to your backpack first! 🎒'); return; }

    aiRecsScroll.innerHTML = '<div class="empty-library">🔥 Digging up the absolute best for you...</div>';
    
    const titles = await AI.recs(lib.map(i => i.name).slice(0, 10));
    aiRecsScroll.innerHTML = '';
    
    for (const title of titles) {

        const result = data.results?.find(x => x.media_type === 'movie' || x.media_type === 'tv');

        const card = document.createElement('div'); card.className = 'library-card ai-pick';

        card.innerHTML = `<div class="card-img-wrapper"><img src="${posterUrl}" alt="" loading="lazy">${progBadge}</div><div class="library-card-title">${result.name || result.title}</div>`;
        card.addEventListener('click', () => { 
            mediaId = result.id; mediaType = result.media_type; manualThemeOverride = null;

        aiRecsScroll.appendChild(card);

    if (!aiRecsScroll.children.length) aiRecsScroll.innerHTML = '<div class="empty-library">No results. Try adding more to your backpack!</div>';
});

favBtn.addEventListener('click', () => toggleFav(mediaId));

$('share-btn').addEventListener('click', () => {
    const textToShare = `Watching ${mediaTitle} on ZestFlix! 🔥`;
    if (navigator.share) navigator.share({ title: 'ZestFlix', text: textToShare });
    else { navigator.clipboard?.writeText(textToShare); alert('Copied to clipboard! 🍿'); }
});

/* ═══════════════════════════════════════════════════
   CHAT LOGIC
═══════════════════════════════════════════════════ */
async function parseAndRenderReply(reply) {
    const recommendRe = /\[RECOMMEND:\s*([^\](]+?)\s*\(\s*(\d{4})\s*,\s*([^)]+?)\s*\)\]/gi;
    const fragments = [];
    let lastIdx = 0;
    let match;

    while ((match = recommendRe.exec(reply)) !== null) {
        const beforeText = reply.slice(lastIdx, match.index).trim();
        if (beforeText) fragments.push({ type: 'text', content: beforeText });
        
        const parsedType = match[3].toLowerCase();
        const finalType = parsedType.includes('movie') || parsedType.includes('film') ? 'movie' : 'tv';
        fragments.push({ type: 'card', title: match[1], year: match[2], mtype: finalType });
        lastIdx = match.index + match[0].length;
    }
    
    const afterText = reply.slice(lastIdx).trim();
    if (afterText) fragments.push({ type: 'text', content: afterText });
    if (!fragments.length) fragments.push({ type: 'text', content: reply });

    for (const frag of fragments) {
        if (frag.type === 'text' && frag.content) {
            const msgEl = document.createElement('div');
            msgEl.className = 'zesty-msg-bot';
            msgEl.innerHTML = mdToHtml(frag.content) || frag.content;
            zestyMessages.appendChild(msgEl);
        } else if (frag.type === 'card') {
            const data = await TMDB.searchMulti(frag.title);
            const result = data.results?.find(x => x.media_type === 'movie' || x.media_type === 'tv');
            
            if (result) {
                const card = document.createElement('div'); card.className = 'zesty-canvas-card';
                const posterUrl = result.poster_path ? `https://image.tmdb.org/t/p/w300${result.poster_path}` : '';
                const displayTitle = result.name || result.title;
                const year = (result.first_air_date || result.release_date || '').slice(0, 4);
                const typeLabel = result.media_type === 'movie' ? '🎬 Movie' : '📺 TV Show';
                
                card.innerHTML = `
                    ${posterUrl ? `<img class="canvas-card-img" src="${posterUrl}" alt="${displayTitle}">` : ''}
                    <div class="canvas-card-body">
                        <div class="canvas-card-title">${displayTitle}</div>
                        <div class="canvas-card-meta">${typeLabel} ${year ? '· ' + year : ''} · ⭐ ${result.vote_average?.toFixed(1) || '?'}</div>
                        <div class="canvas-card-tap">▶ Tap to watch</div>
                    </div>`;
                    
                card.addEventListener('click', () => { 
                    manualThemeOverride = null; loadMedia(result.id, result.media_type); 
                    toggleChat(); window.scrollTo({ top: 0, behavior: 'smooth' }); 
                });
                zestyMessages.appendChild(card);
            }
        }
    }
    zestyMessages.scrollTop = zestyMessages.scrollHeight;
}

async function sendZesty() {
    const text = zestyInput.value.trim(); 
    if (!text) return;
    
    const userMsgEl = document.createElement('div'); 
    userMsgEl.className = 'zesty-msg-user'; userMsgEl.textContent = text;
    zestyMessages.appendChild(userMsgEl); 
    
    zestyInput.value = ''; chatHistory.push({ role: 'user', content: text });
    zestyMessages.scrollTop = zestyMessages.scrollHeight;

    const thinkingEl = document.createElement('div'); 
    thinkingEl.className = 'zesty-msg-bot thinking-dots';
    thinkingEl.textContent = 'Thinking';
    zestyMessages.appendChild(thinkingEl);
    zestyMessages.scrollTop = zestyMessages.scrollHeight;

    const reply = await AI.chat(chatHistory);
    thinkingEl.remove();
    chatHistory.push({ role: 'assistant', content: reply });
    await parseAndRenderReply(reply);
}

zestySend.addEventListener('click', sendZesty);
zestyInput.addEventListener('keydown', e => { 
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendZesty(); } 
});

/* ═══════════════════════════════════════════════════
   AD SUPPRESSION ENGINE
═══════════════════════════════════════════════════ */
(function() {
    // ── 1. POPUP / NEW-TAB BLOCKER ──────────────────────
    // Neuter window.open so no ad popups or pop-unders can open
    const _origOpen = window.open.bind(window);
    window.open = function(url, name, features) {
        // Only allow opens we explicitly trigger (none in this app)
        if (!url || url === '' || url === 'about:blank') return null;
        // Whitelist: allow the player embed origin
        try {
            const u = new URL(url, location.href);
            if (u.hostname === 'vidking.net' || u.hostname.endsWith('.vidking.net')) {
                return _origOpen(url, name, features);
            }
        } catch(e) {}
        console.info('[AdKill] Blocked window.open:', url);
        return null;
    };

    // ── 2. CLICK-HIJACK SHIELD ───────────────────────────
    // Ads often inject a transparent full-page anchor/div over the iframe.
    // We detect clicks on the iframe wrapper and check for injected overlays.
    const iframeWrapper = document.querySelector('.iframe-wrapper');
    iframeWrapper.addEventListener('click', function(e) {
        // Re-focus the iframe after any click so keyboard shortcuts still work
        setTimeout(() => playerFrame.focus(), 100);
    }, true);

    // ── 3. DOM MUTATION OBSERVER ─────────────────────────
    // Watch for ad nodes injected into the page/body in real-time and remove them.
    const AD_PATTERNS = [
        /^ad[s_-]/i, /-ad[s]?$/i, /advert/i, /banner.?ad/i,
        /popunder/i, /pop.?up/i, /interstitial/i, /overlay.?ad/i,
        /google.?ad/i, /adsense/i, /adnxs/i, /doubleclick/i,
        /pubmatic/i, /openx/i, /rubiconproject/i, /amazon-adsystem/i,
        /medianet/i, /outbrain/i, /taboola/i, /revcontent/i
    ];

    const AD_TAG_IFRAMES = [
        'doubleclick.net', 'googlesyndication.com', 'adnxs.com',
        'rubiconproject.com', 'pubmatic.com', 'openx.net', 'amazon-adsystem.com',
        'medianet.com', 'taboola.com', 'outbrain.com', 'adform.net',
        'criteo.com', 'teads.tv', 'sharethrough.com', 'moatads.com'
    ];

    function isAdNode(node) {
        if (!(node instanceof Element)) return false;
        const id = (node.id || '').toLowerCase();
        const cls = (node.className && typeof node.className === 'string') ? node.className.toLowerCase() : '';
        for (const p of AD_PATTERNS) {
            if (p.test(id) || p.test(cls)) return true;
        }
        // Check for ad iframes by src
        if (node.tagName === 'IFRAME') {
            const src = node.src || '';
            for (const domain of AD_TAG_IFRAMES) {
                if (src.includes(domain)) return true;
            }
        }
        // Check for injected <script> tags loading ad networks
        if (node.tagName === 'SCRIPT') {
            const src = node.src || '';
            for (const domain of AD_TAG_IFRAMES) {
                if (src.includes(domain)) return true;
            }
        }
        return false;
    }

    function killAdNode(node) {
        try { node.remove(); } catch(e) {}
    }

    // Check existing DOM first
    document.querySelectorAll('*').forEach(node => {
        if (isAdNode(node)) killAdNode(node);
    });

    // Live watcher
    const adObserver = new MutationObserver(mutations => {
        for (const mut of mutations) {
            for (const node of mut.addedNodes) {
                if (isAdNode(node)) { killAdNode(node); continue; }
                // Also check children of added nodes
                if (node.querySelectorAll) {
                    node.querySelectorAll('*').forEach(child => {
                        if (isAdNode(child)) killAdNode(child);
                    });
                }
            }
            // Watch for style mutations that make hidden elements visible (common ad trick)
            if (mut.type === 'attributes' && mut.attributeName === 'style') {
                const el = mut.target;
                if (isAdNode(el)) killAdNode(el);
            }
        }
    });

    adObserver.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class', 'id']
    });

    // ── 4. FIXED OVERLAY KILLER ──────────────────────────
    // Many ad systems inject a fixed/absolute full-screen transparent div
    // to capture clicks and redirect the user. Run periodically.
    function killFloatingAdOverlays() {
        const bodyChildren = document.body.children;
        for (const el of bodyChildren) {
            if (el.id === 'ad-kill-overlay') continue; // our own element
            // Skip known app elements
            const knownIds = ['cinema-fx','bg-backdrop','zesty-toggle','zesty-panel'];
            if (knownIds.includes(el.id)) continue;
            if (el.tagName === 'HEADER' || el.tagName === 'MAIN' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
            if (el.classList.contains('cozy-overlay')) continue;

            const style = window.getComputedStyle(el);
            const pos = style.position;
            const z = parseInt(style.zIndex) || 0;
            const w = parseInt(style.width) || 0;
            const h = parseInt(style.height) || 0;

            // Suspicious: fixed/absolute, high z-index, large size, not one of our elements
            if ((pos === 'fixed' || pos === 'absolute') && z > 500 && w > 200 && h > 200) {
                console.info('[AdKill] Removed suspicious overlay:', el);
                el.remove();
            }
        }
    }

    setInterval(killFloatingAdOverlays, 800);

    // ── 5. IFRAME NAVIGATION GUARD ───────────────────────
    // Some players change the top-level URL via iframe tricks.
    // Intercept beforeunload-style navigation attempts.
    window.addEventListener('beforeunload', e => {
        // If navigation was NOT user-initiated (e.g. a button click), cancel it
        if (!window._userNavigating) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        }
    });

    // Mark explicit user link clicks as safe
    document.addEventListener('click', e => {
        if (e.target.closest('a[href]')) window._userNavigating = true;
    }, true);

    // ── 6. POSTMESSAGE FILTER ────────────────────────────
    // Block postMessages from the iframe that try to open ads
    const _origAddEventListener = EventTarget.prototype.addEventListener;
    // We leave postMessage handling intact but intercept window-level message events
    window.addEventListener('message', e => {
        try {
            const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
            // Block known ad-network message patterns
            if (data && (data.type === 'adClick' || data.event === 'adImpression' || data.ad)) {
                e.stopImmediatePropagation();
            }
        } catch(err) {}
    }, true); // capture phase = runs first

    // ── 7. DOCUMENT-LEVEL CLICK REDIRECT GUARD ───────────────
    // Some embeds attach a click listener to document to redirect on any click.
    // We wrap addEventListener to detect and suppress these.
    let _docClickCount = 0;
    const origDocAddListener = document.addEventListener.bind(document);
    document.addEventListener = function(type, handler, options) {
        if (type === 'click' || type === 'mousedown') {
            _docClickCount++;
            // Allow our own handlers (first few), block bulk injected ones
            if (_docClickCount > 10) {
                const fnStr = handler.toString();
                if (fnStr.includes('open') || fnStr.includes('location') || fnStr.includes('href')) {
                    console.info('[AdKill] Blocked suspicious document click listener');
                    return;
                }
            }
        }
        return origDocAddListener(type, handler, options);
    };

    console.info('[ZestFlix] Ad suppression engine active ✅');
})();

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
renderLib();
loadMedia(mediaId, mediaType);
