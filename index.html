<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZestFlix - Cozy Cafe & Cinema Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

        /* ═══════════════════════════════════════════════════
           VARIABLES
        ═══════════════════════════════════════════════════ */
        :root {
            --bg-deep: #5C4033;
            --nav-bg: rgba(253, 245, 230, 0.95);
            --panel-bg: rgba(253, 245, 230, 0.9);
            --accent-primary: #D4A373;
            --accent-secondary: #7FA998;
            --accent-hover: #E6CCB2;
            --accent-ai: #6E9B85;
            --danger: #D96C6C;
            --input-bg: #FFFFFF;
            --border-color: #A67B5B;
            --frame-color: #3E2723;
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            --bubbly-radius: 30px;
            --card-radius: 20px;
            --shadow-3d: 0 4px 0 rgba(62, 39, 35, 0.15);
            --shadow-float: 0 10px 25px rgba(62, 39, 35, 0.2);
        }

        /* ── MOVIE THEME ── */
        body.movie-mode {
            --bg-deep: #0a0e1a;
            --nav-bg: rgba(8, 14, 32, 0.95);
            --panel-bg: rgba(8, 14, 32, 0.88);
            --accent-primary: #4a6fa5;
            --accent-secondary: #2d4a7a;
            --accent-hover: #1e3560;
            --accent-ai: #4a6fa5;
            --border-color: #2a4080;
            --frame-color: #050a15;
            --text-main: #e8eaf6;
            --text-muted: #7986cb;
            --shadow-3d: 0 4px 0 rgba(0, 10, 40, 0.4);
            --shadow-float: 0 10px 30px rgba(0, 20, 80, 0.5);
        }

        body.movie-mode .cozy-overlay { background: radial-gradient(ellipse at 50% 30%, rgba(74,111,165,0.18) 0%, rgba(5,10,25,0.85) 100%) !important; }
        body.movie-mode .background-backdrop { filter: blur(40px) brightness(0.3) saturate(0.4) !important; }
        body.movie-mode .show-overview { border-left-color: #4a6fa5; background: rgba(74,111,165,0.1); }
        body.movie-mode .library-section { background: rgba(8,14,32,0.7); border-color: #2a4080; }
        body.movie-mode .badge { background: rgba(74,111,165,0.15); color: #a0b8e8; }
        body.movie-mode .badge.rating { background: rgba(106,90,205,0.18); color: #9fa8da; }
        body.movie-mode .dropdown-header { background-color: #2d4a7a; border-color: #3a5a9a; }
        body.movie-mode .search-results { background: rgba(8,14,32,0.98); border-color: #2a4080; }
        body.movie-mode .search-item:hover { background: rgba(74,111,165,0.2); }
        body.movie-mode .cinema-fx { display: block !important; opacity: 1 !important; z-index: -1; }
        body.movie-mode .zesty-msg-bot { background: #0e1830; border-color: #2a4080; color: #c5cae9; }
        body.movie-mode .zesty-header { background: #1a2d5a; }
        body.movie-mode .zesty-panel { background: #080e20; border-color: #2a4080; }
        body.movie-mode input, body.movie-mode .action-btn { background: #0e1830; border-color: #2a4080; color: #e8eaf6; }
        body.movie-mode input::placeholder { color: #7986cb; }
        body.movie-mode .ai-insights-panel { background: rgba(74,111,165,0.15); border-color: #2a4080; color: #e8eaf6;}
        body.movie-mode .show-info { background: rgba(8,14,32,0.88); border-color: #2a4080; }
        body.movie-mode .navbar { background: rgba(8,14,32,0.95); border-color: #2a4080; }
        body.movie-mode .library-title { color: #c5cae9; }
        body.movie-mode .empty-library { color: #7986cb; }
        body.movie-mode .library-card { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .library-card-title { color: #c5cae9; background: linear-gradient(180deg, #0e1a35, #0a1428); border-top-color: #1e3560; }
        body.movie-mode .dropdown-list { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .dropdown-item:hover, body.movie-mode .dropdown-item.selected { background: rgba(74,111,165,0.25); color: #fff; }

        /* ═══════════════════════════════════════════════════
           ANIMATIONS & DYNAMIC BG FX
        ═══════════════════════════════════════════════════ */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(110, 155, 133, 0.3), var(--shadow-3d); }
            50% { box-shadow: 0 0 20px rgba(110, 155, 133, 0.7), var(--shadow-3d); }
        }
        body.movie-mode @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(74, 111, 165, 0.3), var(--shadow-3d); }
            50% { box-shadow: 0 0 20px rgba(74, 111, 165, 0.7), var(--shadow-3d); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(-6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes sweep {
            0% { transform: translateX(-50%) rotate(-12deg); opacity: 0.15; }
            50% { opacity: 0.4; }
            100% { transform: translateX(-50%) rotate(12deg); opacity: 0.15; }
        }
        @keyframes twinkleLayer {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column;
            overflow-x: hidden; overflow-y: auto; font-size: 16px; overscroll-behavior: none;
            transition: background-color 0.8s ease, color 0.6s ease;
        }

        body.chat-open { overflow: hidden !important; }
        body.chat-open #zesty-toggle { display: none !important; }

        /* Cinematic Particles Background FX - Made highly visible */
        .cinema-fx { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity 1s ease; }
        .cinema-beam { position: absolute; top: -20%; left: 50%; width: 250vw; height: 150vh; background: conic-gradient(from 180deg at 50% 0%, rgba(95, 140, 205, 0.25) 0deg, transparent 40deg, transparent 320deg, rgba(95, 140, 205, 0.25) 360deg); transform-origin: top center; animation: sweep 10s infinite alternate ease-in-out; }
        .stars-layer1 { position: absolute; width: 4px; height: 4px; background: transparent; border-radius: 50%; box-shadow: 10vw 20vh 0 #fff, 20vw 80vh 0 #e8eaf6, 30vw 40vh 0 #fff, 40vw 90vh 0 #9fc3ff, 50vw 10vh 0 #fff, 60vw 60vh 0 #fff, 70vw 30vh 0 #e8eaf6, 80vw 70vh 0 #fff, 90vw 50vh 0 #9fc3ff, 15vw 60vh 0 #fff, 25vw 15vh 0 #fff, 35vw 75vh 0 #e8eaf6, 45vw 25vh 0 #fff, 55vw 85vh 0 #fff, 65vw 5vh 0 #9fc3ff, 75vw 95vh 0 #fff, 85vw 45vh 0 #fff, 95vw 80vh 0 #e8eaf6; animation: twinkleLayer 3s infinite alternate ease-in-out; }
        .stars-layer2 { position: absolute; width: 3px; height: 3px; background: transparent; border-radius: 50%; box-shadow: 5vw 50vh 0 #fff, 15vw 90vh 0 #e8eaf6, 25vw 30vh 0 #fff, 35vw 10vh 0 #9fc3ff, 45vw 60vh 0 #fff, 55vw 40vh 0 #fff, 65vw 80vh 0 #fff, 75vw 20vh 0 #fff, 85vw 15vh 0 #9fc3ff, 95vw 65vh 0 #fff; animation: twinkleLayer 2s infinite alternate-reverse ease-in-out; }

        .background-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -3; background-size: cover; background-position: center; filter: blur(30px) brightness(0.8) sepia(0.3); transition: background-image 1s ease-in-out, filter 0.8s ease; transform: scale(1.1); }
        .cozy-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: radial-gradient(circle at 50% 50%, rgba(212,163,115,0.3) 0%, rgba(92,64,51,0.95) 100%); pointer-events: none; transition: background 0.8s ease; }

        /* Layout & Global Elements */
        .main-content { flex: 1; padding-bottom: 50px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .navbar, .show-info, .library-section { width: 95%; max-width: 1600px; margin: 14px auto; }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background-color: var(--nav-bg); backdrop-filter: blur(20px); border: 3px solid var(--border-color); border-radius: var(--bubbly-radius); box-shadow: var(--shadow-float), var(--shadow-3d); z-index: 100; gap: 20px; transition: background 0.8s ease, border-color 0.6s ease; }
        .nav-left { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
        .nav-right { flex: 2; display: flex; justify-content: flex-end; align-items: center; }
        .logo { font-size: 32px; font-weight: 700; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; gap: 4px; }

        input, textarea { background-color: var(--input-bg); color: var(--text-main); border: 3px solid var(--border-color); padding: 9px 18px; border-radius: var(--bubbly-radius); outline: none; font-size: 16px !important; font-weight: 800; transition: all 0.3s; box-shadow: var(--shadow-3d); width: 100%; user-select: text !important; -webkit-user-select: text !important;}
        input::placeholder { color: #A1887F; }
        input.ai-mode { border-color: var(--accent-ai); box-shadow: 0 0 14px rgba(110,155,133,0.3), var(--shadow-3d); }
        body.movie-mode input.ai-mode { box-shadow: 0 0 14px rgba(74,111,165,0.3), var(--shadow-3d); }
        input:hover { border-color: var(--accent-primary); }

        .action-btn { background-color: var(--accent-hover); color: var(--text-main); border: 3px solid var(--border-color); padding: 9px 18px; border-radius: var(--bubbly-radius); outline: none; font-size: 16px !important; font-weight: 800; transition: all 0.3s; box-shadow: var(--shadow-3d); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(62,39,35,0.18); }
        .action-btn:active { transform: translateY(1px); }
        .action-btn.active-fav { background-color: var(--danger); border-color: #B25858; color: white; }

        .search-container { display: flex; align-items: center; gap: 8px; flex-grow: 1; width: 100%; max-width: 650px;}
        .search-input-wrapper { position: relative; flex: 1; }
        .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
        
        .compact-circle { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px !important;}
        .ai-search-area { background: var(--nav-bg); border: 3px solid var(--border-color); box-shadow: var(--shadow-3d); transition: all 0.3s; cursor: pointer; }
        .ai-search-area.active { border-color: var(--accent-ai); animation: pulseGlow 2.5s infinite; }
        .ai-search-area .ai-search-icon { transition: transform 0.3s; line-height: 1; font-size: 20px;}
        .ai-search-area.active .ai-search-icon { transform: scale(1.15); }

        .search-results { position: absolute; top: calc(100% + 10px); left: 0; width: 100%; background-color: var(--nav-bg); border: 3px solid var(--border-color); border-radius: var(--card-radius); box-shadow: var(--shadow-float); z-index: 200; display: none; flex-direction: column; padding: 8px; }
        .search-results.active { display: flex; animation: popIn 0.2s forwards; }
        .search-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .search-item:hover { background: var(--accent-hover); }
        .search-item img { width: 36px; height: 52px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #ddd; }
        .search-item b { font-size: 14px; font-weight: 800; color: var(--text-main); }
        .search-item small { font-size: 12px; color: var(--text-muted); font-weight: 700; }

        .dropdown-container { display: flex; gap: 10px; align-items: center; }
        .custom-dropdown { position: relative; min-width: 140px; }
        .dropdown-header { background-color: var(--accent-secondary); color: white; border: 3px solid var(--border-color); padding: 9px 16px; border-radius: var(--bubbly-radius); font-size: 15px; font-weight: 800; font-family: 'Fredoka', sans-serif; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-3d); transition: all 0.3s; }
        .dropdown-header:hover { transform: translateY(-2px); }
        .dropdown-header.disabled { opacity: 0.55; pointer-events: none; filter: grayscale(0.5); }
        .dropdown-list { position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: var(--nav-bg); border: 3px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-float); max-height: 260px; overflow-y: auto; z-index: 300; display: none; flex-direction: column; padding: 8px; }
        .dropdown-list.show { display: flex; animation: popIn 0.2s forwards; }
        .dropdown-item { padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 900; font-size: 14px; transition: all 0.2s; }
        .dropdown-item:hover, .dropdown-item.selected { background-color: var(--accent-hover); transform: translateX(4px); }

        /* Desktop Video Frame */
        .iframe-wrapper {
            width: 95%; max-width: 1600px;
            aspect-ratio: 16 / 9;
            position: relative; background: var(--frame-color);
            border: 22px solid #4E342E; outline: 6px solid #2D1B15;
            border-radius: 18px; overflow: hidden;
            box-shadow: 0 0 0 2px #1a0e0a, var(--shadow-float), inset 0 0 50px rgba(0,0,0,0.85);
            margin-top: 14px; transition: border-color 0.8s ease, box-shadow 0.8s ease;
        }
        body.movie-mode .iframe-wrapper { border-color: #1a2d5a; outline-color: #0a1428; box-shadow: 0 0 0 2px #050a14, 0 0 50px rgba(74,111,165,0.3), inset 0 0 60px rgba(0,0,0,0.9); }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Library & Cards */
        .library-section { padding: 24px 30px; background: rgba(253,245,230,0.7); backdrop-filter: blur(10px); border-radius: var(--card-radius); border: 3px dashed var(--border-color); transition: background 0.8s ease, border-color 0.6s ease; }
        .library-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 2px; }
        .library-title { font-size: 34px; font-weight: 700; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; gap: 12px; color: var(--text-main); transition: color 0.6s; }
        
        .header-actions-right { display: flex; align-items: center; gap: 10px; }

        .library-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 14px 4px 22px 4px; scroll-behavior: smooth; }
        .library-scroll::-webkit-scrollbar { height: 5px; }
        .library-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .library-card {
            min-width: 140px; max-width: 140px; position: relative; display: flex; flex-direction: column; cursor: pointer;
            background: linear-gradient(160deg, #f5ece0, #e8d8c4); border-radius: 14px; border: 3px solid var(--border-color);
            box-shadow: 0 5px 12px rgba(62,39,35,0.18); transition: transform 0.2s ease, box-shadow 0.2s ease; flex-shrink: 0; overflow: hidden;
        }
        .library-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(62,39,35,0.25); }
        .library-card.is-favorite { border-color: var(--danger); }
        .card-img-wrapper { position: relative; width: 100%; height: 185px; overflow: hidden; background: #d5c4b0; }
        .library-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .library-card-title { font-size: 12px; font-weight: 900; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 8px 10px 4px; font-family: 'Fredoka', sans-serif; color: #5C3317; background: linear-gradient(180deg, #f5ece0, #e8d2b8); border-top: 2px solid #c4a06e; }

        .fav-badge { position: absolute; top: 5px; left: 5px; font-size: 14px; z-index: 5; background: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .progress-badge { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(92,51,23,0.88); color: #f5ddb0; font-size: 11px; font-weight: 900; padding: 5px 6px; text-align: center; font-family: 'Fredoka', sans-serif; border-top: 1.5px solid rgba(212,160,110,0.4); }
        .progress-badge.is-movie { background: rgba(25,40,90,0.9); color: #9fc3ff; border-top-color: rgba(74,111,165,0.4); }
        body:not(.movie-mode) .progress-badge.is-movie { background: rgba(62,39,35,0.85); color: #e8ccaa; }
        .remove-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; opacity: 0; transition: all 0.2s; z-index: 20; cursor: pointer; }
        .library-card:hover .remove-btn { opacity: 1; }
        .remove-btn:hover { background: var(--danger); transform: scale(1.1); }
        
        .empty-library { padding: 20px 6px; font-weight: 800; color: var(--text-muted); font-size: 15px; }
        .ai-recs-section { margin-top: 14px; padding-top: 12px; border-top: 2px dashed rgba(160,147,166,0.3); }
        .ai-recs-title { font-size: 16px; font-weight: 900; margin-bottom: 0px; padding-left: 4px; }

        /* Show Info Box */
        .show-info { padding: 28px 30px; background: var(--panel-bg); backdrop-filter: blur(16px); border-radius: var(--card-radius); border: 3px solid var(--border-color); box-shadow: var(--shadow-float); display: flex; flex-direction: column; gap: 16px; transition: background 0.8s ease, border-color 0.6s ease; }
        .info-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
        .title-group { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
        .show-title { font-size: 40px; font-weight: 700; font-family: 'Fredoka', sans-serif; line-height: 1.1; transition: color 0.6s; }
        .badges-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge { background: rgba(62,39,35,0.08); padding: 7px 15px; border-radius: 50px; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; transition: background 0.6s, color 0.6s; }
        .badge.rating { background: rgba(229,169,59,0.2); color: #8A5D10; }
        
        .show-overview { font-size: 16px; line-height: 1.75; font-weight: 700; background: rgba(255,255,255,0.6); padding: 18px 22px; border-radius: 14px; border-left: 6px solid var(--accent-primary); transition: background 0.6s, border-color 0.6s; }
        .read-more-btn { color: var(--accent-secondary); font-weight: 900; cursor: pointer; margin-left: 5px; text-decoration: none; }
        body.movie-mode .read-more-btn { color: var(--accent-primary); }

        .ai-insights-panel { display: none; padding: 20px 24px; border-radius: 16px; background: rgba(110, 155, 133, 0.15); border: 2px solid var(--border-color); font-size: 15px; line-height: 1.6; font-weight: 700; animation: slideUp 0.3s ease; margin-top: 6px; }
        .ai-insights-panel.visible { display: block; }
        .insights-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 900; color: var(--accent-ai); font-size: 18px; }
        body.movie-mode .insights-header { color: var(--accent-primary); }

        /* Zesty Chat Interface */
        .zesty-toggle { position: fixed; bottom: 28px; right: 28px; width: 64px; height: 64px; background: var(--accent-secondary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; box-shadow: var(--shadow-float); border: 3px solid white; z-index: 999; touch-action: manipulation; transition: transform 0.2s; }
        body.movie-mode .zesty-toggle { background: var(--accent-primary); }
        .zesty-toggle:active { transform: scale(0.9); }
        
        .zesty-panel { display: none; position: fixed; bottom: 106px; right: 28px; width: 380px; height: 560px; background: var(--nav-bg); border: 3px solid var(--accent-secondary); border-radius: 22px; z-index: 998; flex-direction: column; box-shadow: var(--shadow-float); overflow: hidden; transition: background 0.8s, border-color 0.6s; }
        .zesty-panel.open { display: flex; animation: slideUp 0.25s ease; }
        
        .zesty-header { background: var(--accent-secondary); padding: 14px 18px; color: white; font-weight: 900; font-size: 17px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        body.movie-mode .zesty-header { background: var(--accent-primary); border-color: var(--border-color); }
        .zesty-close-btn { cursor: pointer; font-size: 22px; opacity: 0.85; line-height: 1; touch-action: manipulation; }
        .zesty-messages { flex: 1 1 auto; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; min-height: 0; }
        
        .zesty-msg-user { background: var(--accent-primary); color: white; padding: 10px 15px; border-radius: 18px 18px 4px 18px; align-self: flex-end; font-weight: 800; font-size: 15px; max-width: 85%; word-break: break-word; line-height: 1.4; flex-shrink: 0; }
        .zesty-msg-bot { background: white; padding: 12px 16px; border-radius: 18px 18px 18px 4px; align-self: flex-start; border: 2px solid var(--border-color); font-weight: 700; font-size: 15px; max-width: 88%; word-break: break-word; line-height: 1.5; user-select: text !important; -webkit-user-select: text !important; flex-shrink: 0; }
        
        /* NEW Chat AI Canvas Cards - Horizontal & Sleek */
        .zesty-canvas-card { display: flex; flex-direction: row; align-items: stretch; width: 100%; max-width: 320px; background: white; border: 2.5px solid var(--border-color); border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: 0 4px 12px rgba(62,39,35,0.12); transition: transform 0.2s, box-shadow 0.2s; align-self: flex-start; flex-shrink: 0; margin-top: 2px; margin-bottom: 2px; }

function mdToHtml(raw) {
    if (!raw) return '';
    let formattedText = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
    const lines = formattedText.split('\n');
    let html = '';
    let inList = false;
    
    for (const line of lines) {
        const bulletMatch = line.match(/^[\*\-]\s+(.+)/);
        if (bulletMatch) {
            if (!inList) { html += '<ul style="padding-left:22px; margin:8px 0;">'; inList = true; }
            html += `<li style="margin-bottom:6px;">${bulletMatch[1]}</li>`;
        } else {
            if (inList) { html += '</ul>'; inList = false; }
            if (line.trim()) html += `<p style="margin-bottom:12px;">${line.trim()}</p>`;
        }
    }
    if (inList) html += '</ul>';
    return html;
}

/* ═══════════════════════════════════════════════════

const AI = {
    // Tiers: Massive Brain -> Balanced -> Blazing Fast
    models: ['llama-3.3-70b-versatile', 'mixtral-8x7b-32768', 'llama-3.1-8b-instant'],

    async fetchAIModel(msgs, model) {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer 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' },
            body: JSON.stringify({ model: model, messages: msgs, temperature: 0.7 })
        });
        if (!res.ok) throw new Error(res.status === 429 ? 'rate_limit' : 'api_error');
        const data = await res.json();
        return data.choices[0].message.content.trim();
    },

    async call(prompt, systemPrompt = '') {
        const msgs = systemPrompt ? [{ role: 'system', content: systemPrompt }] : [];
        msgs.push({ role: 'user', content: prompt });
        
        for (const model of this.models) {
            try {
                return await this.fetchAIModel(msgs, model);
            } catch (e) {
                console.warn(`Model ${model} blocked (${e.message}), gracefully cascading to next model...`);
            }
        }
        return null; // Entire stack failed
    },
    
    async smartSearch(query) {
        const text = await this.call(`Return ONLY the exact title of the movie/show for this search: "${query}". No extra text.`);
        return text || query;

    async insights(title, type, year) {
        const prompt = `Give me a deep, highly engaging intelligence briefing for the ${type} "${title}" (${year}). 
Write exactly 3 distinct paragraphs or bullet points covering fascinating behind-the-scenes trivia, deeper plot analysis, and its cultural impact. 
Make it rich, detailed, and conversational. Do not limit the word count - dive deep into the facts! Feel free to use occasional emojis to match the vibe.`;
        const text = await this.call(prompt);
        return text || '<em>Too swaggy to load right now! Check connection.</em>';
    },
    
    async recs(titles) {
        const text = await this.call(`Based on these titles: ${titles.join(', ')} — give 5 amazing, critically acclaimed similar titles. Return ONLY a pure JSON array of strings. Example: ["Title A","Title B"]`);
        if (!text) return [];
        try { const match = text.match(/\[[\s\S]*\]/); return match ? JSON.parse(match[0]) : []; } 
        catch { return []; }
    },
    
    async chat(history) {
        const systemPrompt = `You are Zesty, an AI movie assistant. You are witty, smart, very friendly, and use the 🍋 emoji occasionally. 
1. ACTUALLY READ and respond logically to the user's conversation! Do NOT just blind-recommend things.
2. Keep textual responses brief and conversational (1-3 sentences).

DO NOT add the year or type inside the brackets. 
Example of a perfect response: "Oh I completely agree! If you loved that, you should definitely check out [RECOMMEND: Breaking Bad]. It's a masterpiece 🍋"`;
        
        const chatLog = history.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');
        const reply = await this.call(chatLog, systemPrompt);
        return reply || "Connection interrupted! We'll get 'em next time 🍋";
    }
};

function getLib() { return JSON.parse(localStorage.getItem('streamToyLibrary') || '[]'); }
function saveLib(lib) { localStorage.setItem('streamToyLibrary', JSON.stringify(lib)); renderLib(); updateFavUI(); }
function upsertLib(data, type, season=1, episode=1) {
    let lib = getLib();
    const existing = lib.find(i => i.id == data.id && i.mediaType === type);
    const isFav = existing ? existing.favorite : false;
    lib = lib.filter(i => !(i.id == data.id && i.mediaType === type));
    lib.unshift({ id: data.id, name: data.name||data.title, poster: data.poster_path, mediaType: type, season: season, episode: episode, favorite: isFav });
    if (lib.length > 20) lib.pop();
    saveLib(lib);
}
function updateProgress(id, season, episode) {
    if (mediaType === 'movie') return;
    let lib = getLib(); 
    const idx = lib.findIndex(x => x.id == id && x.mediaType === 'tv');
    if (idx !== -1 && (lib[idx].season != season || lib[idx].episode != episode)) { 
        lib[idx].season = season; lib[idx].episode = episode; saveLib(lib); 
        if (id == mediaId) {
            seasonVal = season; episodeVal = episode;
            seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`;
            episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`;
        }
    }
}
function toggleFav(id) {
    let lib = getLib(); 
    const idx = lib.findIndex(x => x.id == id && x.mediaType === mediaType);
    if (idx !== -1) { lib[idx].favorite = !lib[idx].favorite; saveLib(lib); }
}
function updateFavUI() {
    const cur = getLib().find(i => i.id == mediaId && i.mediaType == mediaType);

    else { favBtn.innerHTML = '<span class="emoji-icon">🤍</span> Favorite'; favBtn.classList.remove('active-fav'); }
}

function renderLib() {
    let lib = getLib(); libraryScroll.innerHTML = '';
    if (!lib.length) { libraryScroll.innerHTML = '<div class="empty-library">Backpack empty! 🏕️ Search to start.</div>'; return; }
    lib.sort((a,b) => (b.favorite===true) - (a.favorite===true));
    
    lib.forEach(item => {
        const card = document.createElement('div'); card.className = `library-card ${item.favorite?'is-favorite':''}`;
        const posterUrl = item.poster ? `https://image.tmdb.org/t/p/w200${item.poster}` : '';
        const favB = item.favorite ? '<div class="fav-badge">❤️</div>' : '';
        const progB = item.mediaType === 'movie' ? `<div class="progress-badge is-movie">🎬 FILM</div>` : `<div class="progress-badge">S${item.season||1} · E${item.episode||1}</div>`;
        card.innerHTML = `<div class="remove-btn" title="Remove">✕</div><div class="card-img-wrapper">${favB}<img src="${posterUrl}" loading="lazy">${progB}</div><div class="library-card-title">${item.name}</div>`;
        card.querySelector('.remove-btn').onclick = e => { e.stopPropagation(); saveLib(getLib().filter(i => !(i.id==item.id && i.mediaType===item.mediaType))); };
        card.onclick = () => { loadMedia(item.id, item.mediaType, item.season, item.episode); window.scrollTo({top:0, behavior:'smooth'}); };
        libraryScroll.appendChild(card);
    });
}

            const valids = data.results?.filter(i => i.media_type !== 'person').slice(0, 6) || [];
            valids.forEach(item => {
                const el = document.createElement('div'); el.className = 'search-item';
                const img = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : '';
                const yr = (item.first_air_date||item.release_date||'').slice(0,4);
                el.innerHTML = `<img src="${img}"><div><b>${item.name||item.title}</b><br><small>${item.media_type==='movie'?'🎬':'📺'} ${yr?'· '+yr:''}</small></div>`;
                el.onclick = () => { searchInput.value = ''; searchResults.classList.remove('active'); loadMedia(item.id, item.media_type); };
                searchResults.appendChild(el);
            });
            searchResults.classList.add('active');
            if(!valids.length) searchResults.innerHTML = `<div class="search-item"><b>No results.</b></div>`;
        } catch(e) {}
    }, aiSearchOn ? 600 : 380);
});

function toggleDD(list) {
    if(list!==seasonList) seasonList.classList.remove('show');
    if(list!==episodeList) episodeList.classList.remove('show');
    list.classList.toggle('show');
}
seasonHeader.onclick = () => { if(!seasonHeader.classList.contains('disabled')) toggleDD(seasonList); };
episodeHeader.onclick = () => { if(!episodeHeader.classList.contains('disabled')) toggleDD(episodeList); };
document.onclick = e => { 
    if(!e.target.closest('.custom-dropdown')) { seasonList.classList.remove('show'); episodeList.classList.remove('show'); }
    if(!e.target.closest('.search-container')) searchResults.classList.remove('active');
};

function buildSeasonDD(seasons, tar) {
    seasonList.innerHTML = '';
    seasons.forEach(s => {
        const el = document.createElement('div'); el.className = 'dropdown-item'; el.textContent = `Season ${s.season_number}`;
        if(s.season_number == tar) el.classList.add('selected');
        el.onclick = () => { seasonVal = s.season_number; seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`; seasonList.classList.remove('show'); loadEpisodes(mediaId, seasonVal); };
        seasonList.appendChild(el);
    });
    seasonHeader.classList.remove('disabled');
}

function buildEpisodeDD(eps, tar) {
    episodeList.innerHTML = '';
    eps.forEach(ep => {
        const el = document.createElement('div'); el.className = 'dropdown-item'; 
        const name = ep.name.length>24?ep.name.slice(0,24)+'…':ep.name;
        el.textContent = `Ep ${ep.episode_number}: ${name}`;
        if(ep.episode_number == tar) el.classList.add('selected');
        el.onclick = () => { episodeVal = ep.episode_number; episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`; episodeList.classList.remove('show'); updatePlayer(); };
        episodeList.appendChild(el);
    });
    episodeHeader.classList.remove('disabled');
}

async function loadEpisodes(id, sNum, tar=null) {
    const data = await TMDB.getEpisodes(id, sNum);
    if(data.episodes?.length) {
        episodeVal = tar || data.episodes[0].episode_number;
        episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`;
        buildEpisodeDD(data.episodes, episodeVal); 
        updatePlayer();
    }
}

function truncateOverview(text) {
    if (!text) return 'No story available.';
    if (text.length <= 160) return text;
    return `<span class="short-desc">${text.slice(0, 160)}...</span><span class="full-desc" style="display:none;">${text}</span><a href="#" class="read-more-btn">Read More</a>`;
}

async function loadMedia(id, type, tSeason=null, tEp=null) {
    mediaId = id; mediaType = type; currentInsightId = id;
    
    try {
        applyTheme(type);
        const details = await TMDB.getDetails(id, type);
        upsertLib(details, type, tSeason||1, tEp||1);

        if (details.backdrop_path && window.innerWidth > 768) {
            bgBackdrop.style.backgroundImage = `url(https://image.tmdb.org/t/p/original${details.backdrop_path})`;
        }

        mediaTitle = details.name || details.title;
        const releaseDate = details.first_air_date || details.release_date; 
        mediaYear = releaseDate ? releaseDate.slice(0, 4) : 'N/A';
        
        infoTitle.textContent = mediaTitle;
        infoType.innerHTML = `<span class="emoji-icon">${type === 'movie'?'🎬':'📺'}</span> ${type === 'movie'?'Movie':'TV Show'}`;
        infoYear.innerHTML = `<span class="emoji-icon">📅</span> ${mediaYear}`;
        infoRating.innerHTML = `<span class="emoji-icon">⭐</span> ${details.vote_average?.toFixed(1)||'N/A'}`;
        
        infoOverview.innerHTML = truncateOverview(details.overview);
        const readBtn = infoOverview.querySelector('.read-more-btn');
        if (readBtn) {
            readBtn.onclick = e => {
                e.preventDefault();
                const isS = infoOverview.querySelector('.full-desc').style.display === 'none';
                infoOverview.querySelector('.short-desc').style.display = isS?'none':'inline';
                infoOverview.querySelector('.full-desc').style.display = isS?'inline':'none';
                e.target.textContent = isS?' Show Less':' Read More';
            };
        }

        document.querySelectorAll('.genre-badge').forEach(e => e.remove());
        details.genres?.slice(0, 3).forEach(g => {
            const span = document.createElement('span'); span.className = 'badge genre-badge'; span.innerHTML = `<span class="emoji-icon">🎭</span> ${g.name}`;
            badgesRow.appendChild(span);
        });

        if (type === 'movie') { 
            $('dropdown-group').style.display = 'none'; updatePlayer(); 
        } else {
            $('dropdown-group').style.display = 'flex';
            const valid = details.seasons?.filter(s => s.season_number > 0) || [];
            if (valid.length) {
                seasonVal = tSeason || valid[0].season_number;
                seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`;
                buildSeasonDD(valid, seasonVal);
                await loadEpisodes(id, seasonVal, tEp);
            }
        }
        
        updateFavUI();
        
        aiInsightsPanel.classList.remove('visible');
        $('insights-content').innerHTML = '<em style="opacity:0.75;font-weight:800;">💡 Fetching deep intelligence...</em>';
        
        setTimeout(() => {
            aiInsightsPanel.classList.add('visible');
            AI.insights(mediaTitle, type==='tv'?'TV Show':'Movie', mediaYear).then(res => {
                if (currentInsightId === id) $('insights-content').innerHTML = mdToHtml(res);
            }).catch(e => {
                if (currentInsightId === id) $('insights-content').innerHTML = '<em>Failed to load deep intel.</em>';
            });
        }, 800);
        
    } catch(e) {}
}

aiRecsBtn.addEventListener('click', async () => {
    aiRecsBtn.classList.toggle('active');
    if (aiRecsContainer.style.display === 'block') { aiRecsContainer.style.display = 'none'; return; }
    const lib = getLib(); if (!lib.length) return alert('Backpack empty! Add items first 🎒'); 
    
    aiRecsContainer.style.display = 'block';
    aiRecsScroll.innerHTML = '<div class="empty-library">🎯 Cooking up bangers...</div>';
    
    const titles = await AI.recs(lib.map(i => i.name).slice(0, 10));
    aiRecsScroll.innerHTML = '';
    
    for (const title of titles) {
        const data = await TMDB.searchMulti(title);
        const res = data.results?.find(x => x.media_type === 'movie' || x.media_type === 'tv');
        if (!res) continue;
        
        const card = document.createElement('div'); card.className = 'library-card';
        const pUrl = res.poster_path ? `https://image.tmdb.org/t/p/w200${res.poster_path}` : '';
        const badge = res.media_type === 'movie' ? `<div class="progress-badge is-movie">🎬 FILM</div>` : `<div class="progress-badge">TV Show</div>`;
        card.innerHTML = `<div class="card-img-wrapper"><img src="${pUrl}" loading="lazy">${badge}</div><div class="library-card-title">${res.name||res.title}</div>`;
        card.onclick = () => { loadMedia(res.id, res.media_type); window.scrollTo({top:0, behavior:'smooth'}); };
        aiRecsScroll.appendChild(card);
    }
});

favBtn.onclick = () => toggleFav(mediaId);
$('share-btn').onclick = () => {
    const text = `Watching ${mediaTitle} on ZestFlix! 🍿`;
    if(navigator.share) navigator.share({ title:'ZestFlix', text });
    else { navigator.clipboard?.writeText(text); alert('Copied to clipboard! 🍿'); }
};

/* Un-breakable Chat Horizontal Card Parser */
async function parseAndRenderReply(reply) {
    const re = /\[RECOMMEND:\s*([^\]]+)\]/gi;
    const fragments = []; let last = 0; let m;

    while ((m = re.exec(reply)) !== null) {
        const bText = reply.slice(last, m.index).trim();
        if (bText) fragments.push({ type: 'text', content: bText });
        
        let cleanTitle = m[1].replace(/\s*\([^)]*\)/g, '').trim();
        fragments.push({ type: 'card', title: cleanTitle });
        last = m.index + m[0].length;
    }
    const aText = reply.slice(last).trim();
    if (aText) fragments.push({ type: 'text', content: aText });
    if (!fragments.length) fragments.push({ type: 'text', content: reply });

    for (const f of fragments) {
        if (f.type === 'text') {
            const el = document.createElement('div'); el.className = 'zesty-msg-bot'; el.innerHTML = mdToHtml(f.content) || f.content;
            zestyMessages.appendChild(el);
        } else if (f.type === 'card') {
            const data = await TMDB.searchMulti(f.title);
            const r = data.results?.find(x => x.media_type === 'movie' || x.media_type === 'tv');
            if (r) {
                const c = document.createElement('div'); c.className = 'zesty-canvas-card';
                const p = r.poster_path ? `https://image.tmdb.org/t/p/w300${r.poster_path}` : '';
                // Uses Horizontal Layout Now
                c.innerHTML = `${p ? `<img class="canvas-card-img" src="${p}">`:''} <div class="canvas-card-body"><div class="canvas-card-title">${r.name||r.title}</div><div class="canvas-card-meta">${r.media_type==='movie'?'🎬 Movie':'📺 TV Show'} · ⭐ ${r.vote_average?.toFixed(1)||'?'}</div></div>`;
                c.onclick = () => { loadMedia(r.id, r.media_type); toggleChat(); window.scrollTo({top:0, behavior:'smooth'}); };
                zestyMessages.appendChild(c);
            }
        }
    }
    zestyMessages.scrollTop = zestyMessages.scrollHeight;
}

async function sendZesty() {
    const text = zestyInput.value.trim(); if (!text) return;
    
    const usr = document.createElement('div'); usr.className = 'zesty-msg-user'; usr.textContent = text;
    zestyMessages.appendChild(usr); zestyInput.value = '';
    chatHistory.push({ role: 'user', content: text }); zestyMessages.scrollTop = zestyMessages.scrollHeight;

    const think = document.createElement('div'); think.className = 'zesty-msg-bot thinking-dots'; think.textContent = 'Cooking';
    zestyMessages.appendChild(think); zestyMessages.scrollTop = zestyMessages.scrollHeight;

    const reply = await AI.chat(chatHistory);
    think.remove();
    chatHistory.push({ role: 'assistant', content: reply });
    await parseAndRenderReply(reply);
}

zestySend.onclick = sendZesty;
zestyInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendZesty(); } };

renderLib();
loadMedia(mediaId, mediaType);
</script>
