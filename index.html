<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZestFlix - Cozy Cafe Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

        :root {
            --bg-deep: #5C4033;
            --nav-bg: rgba(253, 245, 230, 0.95);
            --panel-bg: rgba(253, 245, 230, 0.9);
            --accent-primary: #D4A373;
            --accent-secondary: #7FA998;
            --accent-hover: #E6CCB2;
            --accent-ai: #A093A6;
            --danger: #D96C6C;
            --input-bg: #FFFFFF;
            --border-color: #A67B5B;
            --frame-color: #3E2723;
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            --bubbly-radius: 30px;
            --card-radius: 20px;
            --shadow-3d: 0 4px 0 rgba(62, 39, 35, 0.15);
            --shadow-float: 0 10px 25px rgba(62, 39, 35, 0.2);
        }

        /* ── MOVIE THEME ── */
        body.movie-mode {
            --bg-deep: #0a0e1a;
            --nav-bg: rgba(8, 14, 32, 0.95);
            --panel-bg: rgba(8, 14, 32, 0.88);
            --accent-primary: #4a6fa5;
            --accent-secondary: #2d4a7a;
            --accent-hover: #1e3560;
            --accent-ai: #6a5acd;
            --border-color: #2a4080;
            --frame-color: #050a15;
            --text-main: #e8eaf6;
            --text-muted: #7986cb;
            --shadow-3d: 0 4px 0 rgba(0, 10, 40, 0.4);
            --shadow-float: 0 10px 30px rgba(0, 20, 80, 0.5);
        }
        body.movie-mode .cozy-overlay {
            background: radial-gradient(ellipse at 50% 30%, rgba(74,111,165,0.18) 0%, rgba(5,10,25,0.97) 100%) !important;
        }
        body.movie-mode .background-backdrop {
            filter: blur(40px) brightness(0.3) saturate(0.4) !important;
        }
        body.movie-mode .show-overview {
            border-left-color: #4a6fa5;
            background: rgba(74,111,165,0.1);
        }
        body.movie-mode .library-section {
            background: rgba(8,14,32,0.7);
            border-color: #2a4080;
        }
        body.movie-mode .badge {
            background: rgba(74,111,165,0.15);
            color: #a0b8e8;
        }
        body.movie-mode .badge.rating { background: rgba(106,90,205,0.18); color: #9fa8da; }
        body.movie-mode .dropdown-header { background-color: #2d4a7a; border-color: #3a5a9a; }
        body.movie-mode .search-results { background: rgba(8,14,32,0.98); border-color: #2a4080; }
        body.movie-mode .search-item:hover { background: rgba(74,111,165,0.2); }
        body.movie-mode .stars-bg { display: block !important; }
        body.movie-mode .zesty-msg-bot { background: #0e1830; border-color: #2a4080; color: #c5cae9; }
        body.movie-mode .zesty-header { background: #1a2d5a; }
        body.movie-mode .zesty-panel { background: #080e20; border-color: #2a4080; }
        body.movie-mode input, body.movie-mode .action-btn { background: #0e1830; border-color: #2a4080; color: #e8eaf6; }
        body.movie-mode input::placeholder { color: #7986cb; }
        body.movie-mode .ai-insights-panel { background: linear-gradient(135deg, rgba(106,90,205,0.15), rgba(74,111,165,0.2)); border-color: rgba(106,90,205,0.4); }
        body.movie-mode .show-info { background: rgba(8,14,32,0.88); border-color: #2a4080; }
        body.movie-mode .navbar { background: rgba(8,14,32,0.95); border-color: #2a4080; }
        body.movie-mode .library-title { color: #c5cae9; }
        body.movie-mode .empty-library { color: #7986cb; }
        body.movie-mode .library-card { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .library-card-title { color: #c5cae9; }
        body.movie-mode .dropdown-list { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .dropdown-item:hover, body.movie-mode .dropdown-item.selected { background: rgba(74,111,165,0.25); }
        body.movie-mode .ai-btn-pill { background: linear-gradient(135deg, #4a2d8a, #2d4a7a) !important; border-color: #6a5acd !important; }
        body.movie-mode .ai-search-label { color: #9fa8da !important; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%       { transform: translateY(-8px) rotate(3deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(157,129,137,0.3), var(--shadow-3d); }
            50%       { box-shadow: 0 0 20px rgba(157,129,137,0.7), var(--shadow-3d); }
        }
        @keyframes movieGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(74,111,165,0.4), var(--shadow-3d); }
            50%       { box-shadow: 0 0 30px rgba(106,90,205,0.6), var(--shadow-3d); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(-6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* ── Base Reset ── */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', system-ui, sans-serif;
            -webkit-user-select: none; -moz-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-deep); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column;
            overflow-x: hidden; overflow-y: auto; font-size: 16px;
            overscroll-behavior: none;
            transition: background-color 0.8s ease, color 0.6s ease;
        }

        /* ── Stars Background (Movie Mode) ── */
        .stars-bg {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        /* ── Backgrounds ── */
        .background-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-size: cover; background-position: center;
            filter: blur(30px) brightness(0.8) sepia(0.3);
            transition: background-image 1s ease-in-out, filter 0.8s ease; transform: scale(1.1);
        }
        .cozy-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(212,163,115,0.3) 0%, rgba(92,64,51,0.95) 100%);
            pointer-events: none; transition: background 0.8s ease;
        }

        /* ── Layout ── */
        .navbar, .show-info, .library-section {
            width: 95%; max-width: 1400px; margin: 14px auto;
        }

        /* ── Navbar ── */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background-color: var(--nav-bg);
            backdrop-filter: blur(20px); border: 3px solid var(--border-color);
            border-radius: var(--bubbly-radius); box-shadow: var(--shadow-float), var(--shadow-3d);
            z-index: 100; flex-wrap: nowrap; gap: 20px;
            transition: background 0.8s ease, border-color 0.6s ease;
        }
        .nav-left { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
        .logo { font-size: 32px; font-weight: 700; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; gap: 4px; }
        .nav-right { flex: 2; display: flex; justify-content: flex-end; align-items: center; }

        /* ── Inputs ── */
        input, textarea {
            background-color: var(--input-bg); color: var(--text-main);
            border: 3px solid var(--border-color); padding: 9px 18px;
            border-radius: var(--bubbly-radius); outline: none;
            font-size: 16px !important;
            font-weight: 800;
            transition: all 0.3s;
            box-shadow: var(--shadow-3d); cursor: text; touch-action: manipulation;
            -webkit-user-select: text !important; user-select: text !important;
            transition: background 0.6s, border-color 0.6s, color 0.4s;
        }
        input { width: 100%; }
        input::placeholder { color: #A1887F; transition: color 0.3s; }
        input.ai-mode { background-color: #FDFBFF; border-color: var(--accent-ai); box-shadow: 0 0 14px rgba(160,147,166,0.5), var(--shadow-3d); }
        input.ai-mode::placeholder { color: #8F7D96; font-style: italic; }
        input:hover { border-color: var(--accent-primary); }

        /* ── Action Buttons ── */
        .action-btn {
            background-color: var(--accent-hover); color: var(--text-main);
            border: 3px solid var(--border-color); padding: 9px 18px;
            border-radius: var(--bubbly-radius); outline: none;
            font-size: 16px !important; font-weight: 800;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-3d); cursor: pointer; touch-action: manipulation;
            white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(62,39,35,0.18); }
        .action-btn:active { transform: translateY(1px); }
        .action-btn.active-fav { background-color: var(--danger); border-color: #B25858; color: white; }

        /* ── AI Pill Buttons (Insights, Picks, Search) ── */
        .ai-btn-pill {
            background: linear-gradient(135deg, #c8a0d8, #8C737A, #a093a6);
            background-size: 200% auto;
            border: 2.5px solid #8C737A;
            color: white;
            padding: 10px 20px;
            border-radius: var(--bubbly-radius);
            font-size: 14px !important;
            font-weight: 900;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(140,115,122,0.35), var(--shadow-3d);
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
            white-space: nowrap;
            position: relative; overflow: hidden;
            letter-spacing: 0.3px;
        }
        .ai-btn-pill::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            background-size: 200% auto;
            animation: shimmer 2.5s linear infinite;
        }
        .ai-btn-pill:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(140,115,122,0.5); }
        .ai-btn-pill:active { transform: translateY(1px); }
        .ai-btn-pill .ai-star { font-size: 16px; animation: float 2s infinite; display: inline-block; }

        /* ── AI Search Toggle ── */
        .ai-search-area {
            display: flex; align-items: center; gap: 10px;
            background: var(--nav-bg); border: 3px solid var(--border-color);
            border-radius: var(--bubbly-radius); padding: 6px 14px 6px 10px;
            box-shadow: var(--shadow-3d); transition: all 0.3s; cursor: pointer;
            flex-shrink: 0; white-space: nowrap;
        }
        .ai-search-area.active {
            border-color: var(--accent-ai);
            background: linear-gradient(135deg, #f5f0ff, #ede4f5);
            box-shadow: 0 0 14px rgba(160,147,166,0.45), var(--shadow-3d);
            animation: pulseGlow 2.5s infinite;
        }
        .ai-search-icon { font-size: 20px; transition: transform 0.3s; }
        .ai-search-area.active .ai-search-icon { transform: rotate(20deg) scale(1.15); }
        .ai-search-label { font-size: 13px; font-weight: 900; color: var(--text-muted); letter-spacing: 0.4px; }
        .ai-search-area.active .ai-search-label { color: #7a5d8a; }

        /* ── Dropdowns ── */
        .dropdown-container { display: flex; gap: 10px; align-items: center; }
        .custom-dropdown { position: relative; min-width: 140px; }
        .dropdown-header {
            background-color: var(--accent-secondary); color: white; border: 3px solid #6E9B85;
            padding: 9px 16px; border-radius: var(--bubbly-radius); font-size: 15px; font-weight: 700;
            font-family: 'Fredoka', sans-serif; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; transition: all 0.3s; box-shadow: var(--shadow-3d);
        }
        .dropdown-header:hover { transform: translateY(-2px); }
        .dropdown-header.disabled { opacity: 0.55; pointer-events: none; background: #BCAAA4; border-color: #A1887F; }
        .dropdown-list {
            position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: var(--nav-bg);
            border: 3px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-float);
            max-height: 260px; overflow-y: auto; z-index: 300; display: none; flex-direction: column; padding: 8px;
            transition: background 0.6s, border-color 0.6s;
        }
        .dropdown-list.show { display: flex; animation: popIn 0.2s forwards; }
        .dropdown-item { padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.2s; }
        .dropdown-item:hover, .dropdown-item.selected { background-color: var(--accent-hover); transform: translateX(4px); }

        /* ── Search ── */
        .search-container { position: relative; width: 100%; max-width: 620px; display: flex; align-items: center; gap: 10px; flex-grow: 1; }
        .search-input-wrapper { position: relative; flex: 1; }
        .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
        .search-results {
            position: absolute; top: calc(100% + 10px); left: 0; width: 100%;
            background-color: var(--nav-bg); border: 3px solid var(--border-color);
            border-radius: var(--card-radius); box-shadow: var(--shadow-float);
            z-index: 200; display: none; flex-direction: column; padding: 8px;
            transition: background 0.6s, border-color 0.6s;
        }
        .search-results.active { display: flex; animation: popIn 0.2s forwards; }
        .search-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .search-item:hover { background: var(--accent-hover); }
        .search-item img { width: 36px; height: 52px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #ddd; }
        .search-item b { font-size: 14px; font-weight: 800; color: var(--text-main); }
        .search-item small { font-size: 12px; color: var(--text-muted); font-weight: 700; }

        /* ── Main Content ── */
        .main-content { flex: 1; padding-bottom: 50px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }

        /* ── Player Frame ── */
        .iframe-wrapper {
            width: 95%; max-width: 1400px;
            aspect-ratio: 16 / 9;
            position: relative; background: var(--frame-color);
            border: 14px solid #4E342E;
            outline: 4px solid #2D1B15;
            border-radius: 18px; overflow: hidden;
            box-shadow: 0 0 0 2px #1a0e0a, var(--shadow-float), inset 0 0 50px rgba(0,0,0,0.85);
            margin-top: 14px;
            transition: border-color 0.8s ease, box-shadow 0.8s ease;
        }
        body.movie-mode .iframe-wrapper {
            border-color: #1a2d5a;
            outline-color: #0a1428;
            box-shadow: 0 0 0 2px #050a14, 0 0 50px rgba(74,111,165,0.3), inset 0 0 60px rgba(0,0,0,0.9);
        }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* ── Show Info ── */
        .show-info {
            padding: 28px 30px; background: var(--panel-bg); backdrop-filter: blur(16px);
            border-radius: var(--card-radius); border: 3px solid var(--border-color);
            box-shadow: var(--shadow-float); display: flex; flex-direction: column; gap: 16px;
            transition: background 0.8s ease, border-color 0.6s ease;
        }
        .info-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
        .title-group { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
        .show-title { font-size: 40px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: var(--text-main); line-height: 1.1; transition: color 0.6s; }
        .badges-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge {
            background: rgba(62,39,35,0.08); padding: 7px 15px; border-radius: 50px;
            font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-main); transition: background 0.6s, color 0.6s;
        }
        .badge.rating { background: rgba(229,169,59,0.2); color: #8A5D10; }
        .emoji-icon { font-size: 1.1em; line-height: 1; }
        .show-overview {
            font-size: 16px; line-height: 1.75; font-weight: 700;
            background: rgba(255,255,255,0.6); padding: 18px 22px;
            border-radius: 14px; border-left: 6px solid var(--accent-primary);
            transition: background 0.6s, border-color 0.6s; color: var(--text-main);
        }

        /* ── AI Insights Panel ── */
        .ai-insights-panel {
            display: none; padding: 22px 26px; border-radius: 18px;
            background: linear-gradient(135deg, rgba(160,147,166,0.1), rgba(160,147,166,0.2));
            border: 2px solid rgba(140,115,122,0.4);
            font-size: 15px; line-height: 1.8; font-weight: 700;
            animation: slideUp 0.3s ease; color: var(--text-main);
            position: relative; overflow: hidden;
        }
        .ai-insights-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #c8a0d8, #8C737A, #D4A373);
            background-size: 200% auto; animation: shimmer 2s linear infinite;
        }
        .ai-insights-panel.visible { display: block; }
        .ai-insights-panel p { margin-bottom: 10px; }
        .ai-insights-panel ul { padding-left: 20px; margin: 6px 0; }
        .ai-insights-panel li { margin-bottom: 6px; }

        /* ── Library ── */
        .library-section {
            padding: 24px 30px; background: rgba(253,245,230,0.7);
            backdrop-filter: blur(10px); border-radius: var(--card-radius);
            border: 3px dashed var(--border-color);
            transition: background 0.8s ease, border-color 0.6s ease;
        }
        .library-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 2px; }
        .library-title { font-size: 34px; font-weight: 700; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; gap: 12px; color: var(--text-main); transition: color 0.6s; }
        .library-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 14px 4px 22px 4px; scroll-behavior: smooth; }
        .library-scroll::-webkit-scrollbar { height: 5px; }
        .library-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        /* ── Library Cards ── */
        .library-card {
            min-width: 140px; max-width: 140px; position: relative; display: flex;
            flex-direction: column; cursor: pointer;
            background: linear-gradient(160deg, #f5ece0, #e8d8c4);
            border-radius: 14px;
            border: 3px solid #8B5E3C;
            padding: 0; box-shadow: 0 5px 12px rgba(62,39,35,0.18), 0 2px 4px rgba(139,94,60,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            flex-shrink: 0; overflow: hidden;
        }
        body.movie-mode .library-card {
            background: linear-gradient(160deg, #0e1a35, #1a2d50);
            border-color: #2a4080;
        }
        .library-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(62,39,35,0.25); }
        .library-card.is-favorite { border-color: var(--danger); box-shadow: 0 5px 12px rgba(217,108,108,0.3); }
        .card-img-wrapper { position: relative; width: 100%; height: 185px; overflow: hidden; background: #d5c4b0; }
        body.movie-mode .card-img-wrapper { background: #0a1428; }
        .library-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .library-card-title {
            font-size: 12px; font-weight: 900; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding: 8px 10px 4px;
            font-family: 'Fredoka', sans-serif;
            color: #5C3317;
            background: linear-gradient(180deg, #f5ece0, #e8d2b8);
            border-top: 2px solid #c4a06e;
            letter-spacing: 0.3px;
        }
        body.movie-mode .library-card-title {
            color: #a0b8e8; background: linear-gradient(180deg, #0e1a35, #0a1428); border-top-color: #1e3560;
        }

        .fav-badge { position: absolute; top: 5px; left: 5px; font-size: 14px; z-index: 5; background: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .progress-badge {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(92,51,23,0.88); color: #f5ddb0;
            font-size: 11px; font-weight: 900; padding: 5px 6px;
            text-align: center; font-family: 'Fredoka', sans-serif;
            letter-spacing: 0.5px; border-top: 1.5px solid rgba(212,160,110,0.4);
        }
        .progress-badge.is-movie {
            background: rgba(25,40,90,0.9); color: #9fc3ff;
            border-top-color: rgba(74,111,165,0.4);
        }
        body:not(.movie-mode) .progress-badge.is-movie {
            background: rgba(62,39,35,0.85); color: #e8ccaa;
        }

/* ── Markdown → HTML ── */
function mdToHtml(raw) {
    if (!raw) return '';
    let t = raw
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,'<em>$1</em>');
    const lines = t.split('\n');
    let html = '', inList = false;
    for (const line of lines) {
        const bullet = line.match(/^[\*\-]\s+(.+)/);
        if (bullet) {
            if (!inList) { html += '<ul style="padding-left:18px;margin:8px 0;">'; inList = true; }
            html += `<li style="margin-bottom:5px;">${bullet[1]}</li>`;
        } else {
            if (inList) { html += '</ul>'; inList = false; }
            if (line.trim()) html += `<p style="margin-bottom:8px;">${line.trim()}</p>`;
        }
    }
    if (inList) html += '</ul>';
    return html;
}

/* ═══════════════════════════════════════════════════
   AI — Pollinations (keyless)
═══════════════════════════════════════════════════ */
const AI = {
    async call(prompt, systemPrompt = '') {
        try {
            const payload = {
                model: 'openai',
                messages: systemPrompt
                    ? [{ role:'system', content: systemPrompt }, { role:'user', content: prompt }]
                    : [{ role:'user', content: prompt }],
                seed: Math.floor(Math.random()*9999)
            };
            const res = await fetch('https://text.pollinations.ai/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('API fail');
            return (await res.text()).trim();
        } catch (err) {
            console.error('AI Error:', err);
            return '';
        }
    },

    async smartSearch(q) {
        const text = await this.call(
            `Return ONLY the exact title of the movie or TV show described: "${q}". Nothing else, no punctuation, no explanation.`
        );
        return text || q;
    },

    async insights(title, type, year) {
        return await this.call(
            `Give me: 1 short punchy pitch sentence, then 3 fun spoiler-free bullet facts for the ${type} "${title}" (${year}). Be snappy and warm. Max 80 words total.`
        );
    },

    async recs(titles) {
        const text = await this.call(
            `Based on these titles: ${titles.join(', ')} — give me 5 similar must-watch titles. Return ONLY a JSON array of strings. No markdown, no explanation. Example: ["Title A","Title B"]`
        );
        try {
            const clean = text.replace(/```json/gi,'').replace(/```/g,'').trim();
            return JSON.parse(clean);
        } catch { return []; }
    },

    async chat(history) {
        const sys = `You are Zesty 🍋 — a sharp, fun, movie & TV show assistant. Rules:
- Be concise: 1-2 sentences for casual chat, 3-4 max for recs.
- When recommending a show/movie, format your response like this EXACTLY:
  [RECOMMEND: Title (year, type)]
  Then a one-line reason why.
- Be cool, quick, and accurate. No filler. No walls of text.
- Type like you know your cinema. Use emojis sparingly but well.`;
        const messages = history.map(m => ({ role: m.role, content: m.content }));
        const lastUser = history[history.length - 1]?.content || '';
        const text = await this.call(lastUser, sys);
        return text || "Lost connection — try again! 🍋";
    }
};

        el.textContent = `Season ${s.season_number}`;
        if(s.season_number == target) el.classList.add('selected');
        el.onclick = () => { seasonVal=s.season_number; seasonHeader.innerHTML=`Season ${seasonVal} <span>▼</span>`; seasonList.classList.remove('show'); loadEpisodes(mediaId,seasonVal); };
        seasonList.appendChild(el);
    });
    seasonHeader.classList.remove('disabled');
}
function buildEpisodeDD(eps, target) {
    episodeList.innerHTML = '';
    eps.forEach(ep => {
        const el = document.createElement('div'); el.className = 'dropdown-item';
        const n = ep.name.length > 24 ? ep.name.slice(0,24)+'…' : ep.name;
        el.textContent = `Ep ${ep.episode_number}: ${n}`;
        if(ep.episode_number == target) el.classList.add('selected');
        el.onclick = () => { episodeVal=ep.episode_number; episodeHeader.innerHTML=`Ep ${episodeVal} <span>▼</span>`; episodeList.classList.remove('show'); updatePlayer(); };
        episodeList.appendChild(el);
    });
    episodeHeader.classList.remove('disabled');
}

/* ═══════════════════════════════════════════════════
   LIBRARY
═══════════════════════════════════════════════════ */
const getLib   = () => JSON.parse(localStorage.getItem('streamToyLibrary') || '[]');
const saveLib  = lib => { localStorage.setItem('streamToyLibrary', JSON.stringify(lib)); renderLib(); updateFavUI(); };

function upsertLib(data, type, season=1, episode=1) {
    let lib = getLib();
    const isFav = lib.find(i=>i.id==data.id&&i.mediaType===type)?.favorite || false;
    lib = lib.filter(i=>!(i.id==data.id&&i.mediaType===type));
    lib.unshift({ id:data.id, name:data.name||data.title, poster:data.poster_path, mediaType:type, season, episode, favorite:isFav });
    if(lib.length > 20) lib.pop();
    saveLib(lib);
}
function updateProgress(id, season, episode) {
    if(mediaType==='movie') return;
    let lib = getLib(); const i = lib.findIndex(x=>x.id==id&&x.mediaType==='tv');
    if(i!==-1){ lib[i].season=season; lib[i].episode=episode; saveLib(lib); }
}
function toggleFav(id) {
    let lib = getLib(); const i = lib.findIndex(x=>x.id==id&&x.mediaType===mediaType);
    if(i!==-1){ lib[i].favorite=!lib[i].favorite; saveLib(lib); }
}
function updateFavUI() {
    const cur = getLib().find(i=>i.id==mediaId&&i.mediaType==mediaType);
    if(cur?.favorite){ favBtn.innerHTML='<span class="emoji-icon" style="color:#ef4444;">❤️</span> Favorited'; favBtn.classList.add('active-fav'); }
    else             { favBtn.innerHTML='<span class="emoji-icon">🤍</span> Favorite'; favBtn.classList.remove('active-fav'); }
}

function renderLib() {
    let lib = getLib(); libraryScroll.innerHTML = '';
    if(!lib.length) { libraryScroll.innerHTML='<div class="empty-library">Your backpack is empty! 🏕️ Search something to start.</div>'; return; }
    lib.sort((a,b) => (b.favorite===true)-(a.favorite===true));
    lib.forEach(item => {
        const card = document.createElement('div');
        card.className = `library-card ${item.favorite?'is-favorite':''}`;
        const poster = item.poster ? `https://image.tmdb.org/t/p/w200${item.poster}` : '';
        const favBadge = item.favorite ? '<div class="fav-badge">❤️</div>' : '';
        const isMovie = item.mediaType === 'movie';
        const progBadge = isMovie
            ? `<div class="progress-badge is-movie">🎬 FILM</div>`
            : `<div class="progress-badge">S${item.season||1} · E${item.episode||1}</div>`;
        card.innerHTML = `<div class="remove-btn">×</div><div class="card-img-wrapper">${favBadge}<img src="${poster}" alt="" loading="lazy">${progBadge}</div><div class="library-card-title">${item.name}</div>`;
        card.querySelector('.remove-btn').addEventListener('click', e => { e.stopPropagation(); let l=getLib(); l=l.filter(i=>!(i.id==item.id&&i.mediaType===item.mediaType)); saveLib(l); });
        card.addEventListener('click', () => { mediaId=item.id; mediaType=item.mediaType; loadMedia(item.id,item.mediaType,item.season,item.episode); window.scrollTo({top:0,behavior:'smooth'}); });
        libraryScroll.appendChild(card);
    });
}

/* ═══════════════════════════════════════════════════
   PLAYER
═══════════════════════════════════════════════════ */
function updatePlayer() {
    if(mediaType==='movie') playerFrame.src = `https://vidfast.pro/movie/${mediaId}?autoPlay=true`;
    else { playerFrame.src = `https://vidfast.pro/tv/${mediaId}/${seasonVal}/${episodeVal}?autoPlay=true&nextButton=true&autoNext=true`; updateProgress(mediaId,seasonVal,episodeVal); }
}

async function loadEpisodes(tvId, season, targetEp=null) {
    const d = await TMDB.getEpisodes(tvId, season);
    if(d.episodes?.length) {
        episodeVal = targetEp || d.episodes[0].episode_number;
        episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`;
        buildEpisodeDD(d.episodes, episodeVal); updatePlayer();
    }
}

async function loadMedia(id, type, targetSeason=null, targetEpisode=null) {
    try {
        applyTheme(type);
        const d = await TMDB.getDetails(id, type);
        upsertLib(d, type, targetSeason||1, targetEpisode||1);

        if(d.backdrop_path && window.innerWidth > 768)
            bgBackdrop.style.backgroundImage = `url(https://image.tmdb.org/t/p/original${d.backdrop_path})`;

        mediaTitle = d.name||d.title;
        const rel = d.first_air_date||d.release_date; mediaYear = rel?rel.slice(0,4):'N/A';
        infoTitle.textContent = mediaTitle;
        infoType.innerHTML  = `<span class="emoji-icon">${type==='movie'?'🎬':'📺'}</span> ${type==='movie'?'Movie':'TV Show'}`;
        infoYear.innerHTML   = `<span class="emoji-icon">📅</span> ${mediaYear}`;
        infoRating.innerHTML = `<span class="emoji-icon">⭐</span> ${d.vote_average?.toFixed(1)||'N/A'}`;
        infoOverview.textContent = d.overview||'No story available.';
        aiInsightsPanel.classList.remove('visible'); aiInsightsPanel.innerHTML = '';

        document.querySelectorAll('.genre-badge').forEach(e=>e.remove());
        d.genres?.slice(0,3).forEach(g => {
            const s = document.createElement('span'); s.className = 'badge genre-badge';
            s.innerHTML = `<span class="emoji-icon">🎭</span> ${g.name}`;
            badgesRow.appendChild(s);
        });

        if(type==='movie') { $('dropdown-group').style.display='none'; updatePlayer(); }
        else {
            $('dropdown-group').style.display = 'flex';
            const seasons = d.seasons?.filter(s=>s.season_number>0)||[];
            if(seasons.length) {
                seasonVal = targetSeason||seasons[0].season_number;
                seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`;
                buildSeasonDD(seasons, seasonVal);
                await loadEpisodes(id, seasonVal, targetEpisode);
            }
        }
        updateFavUI();
    } catch(e) { console.error('loadMedia:', e); }
}

/* ═══════════════════════════════════════════════════
   AI INSIGHTS
═══════════════════════════════════════════════════ */
aiInsightsBtn.addEventListener('click', async () => {
    if(aiInsightsPanel.classList.contains('visible')) { aiInsightsPanel.classList.remove('visible'); return; }
    aiInsightsPanel.innerHTML = '<em style="opacity:0.65;font-weight:800;">✨ Getting the good stuff...</em>';
    aiInsightsPanel.classList.add('visible');
    const raw = await AI.insights(mediaTitle, mediaType==='tv'?'TV Show':'Movie', mediaYear);
    aiInsightsPanel.innerHTML = mdToHtml(raw) || '<em>No insights available.</em>';
});

/* ═══════════════════════════════════════════════════
   AI PICKS
═══════════════════════════════════════════════════ */
aiRecsBtn.addEventListener('click', async () => {
    const lib = getLib();
    if(!lib.length) { alert('Add something to your backpack first! 🎒'); return; }
    aiRecsContainer.style.display = 'block';
    aiRecsScroll.innerHTML = '<div class="empty-library">🎯 Finding your next obsession...</div>';
    const titles = await AI.recs(lib.map(i=>i.name).slice(0,10));
    aiRecsScroll.innerHTML = '';
    for(const title of titles) {
        const data = await TMDB.searchMulti(title);
        const r = data.results?.find(x=>x.media_type==='movie'||x.media_type==='tv');
        if(!r) continue;
        const card = document.createElement('div'); card.className = 'library-card ai-pick';
        const poster = r.poster_path ? `https://image.tmdb.org/t/p/w200${r.poster_path}` : '';
        const isM = r.media_type === 'movie';
        const prog = isM ? `<div class="progress-badge is-movie">🎬 FILM</div>` : `<div class="progress-badge">TV Show</div>`;
        card.innerHTML = `<div class="card-img-wrapper"><img src="${poster}" alt="" loading="lazy">${prog}</div><div class="library-card-title">${r.name||r.title}</div>`;
        card.addEventListener('click', () => { mediaId=r.id; mediaType=r.media_type; loadMedia(r.id,r.media_type); window.scrollTo({top:0,behavior:'smooth'}); });
        aiRecsScroll.appendChild(card);
    }
    if(!aiRecsScroll.children.length) aiRecsScroll.innerHTML = '<div class="empty-library">No results. Try adding more to your backpack!</div>';
});

/* ═══════════════════════════════════════════════════
   FAV & SHARE
═══════════════════════════════════════════════════ */
favBtn.addEventListener('click', () => toggleFav(mediaId));
$('share-btn').addEventListener('click', () => {
    const txt = `Watching ${mediaTitle} on ZestFlix! 🍿`;
    if(navigator.share) navigator.share({ title:'ZestFlix', text:txt });
    else { navigator.clipboard?.writeText(txt); alert('Copied! 🍿'); }
});

/* ═══════════════════════════════════════════════════
   ZESTY CHAT
═══════════════════════════════════════════════════ */
let chatHistory = [];

zestyToggle.addEventListener('click', () => zestyPanel.classList.add('open'));
zestyClose.addEventListener('click',  () => zestyPanel.classList.remove('open'));

// Parse AI reply for [RECOMMEND: ...] tags and create canvas cards
async function parseAndRenderReply(reply) {
    const recommendRe = /\[RECOMMEND:\s*(.+?)\s*\((\d{4}),\s*(movie|tv|TV|Movie|show|Show)\)\]/gi;
    const fragments = [];
    let lastIdx = 0;
    let match;

    while ((match = recommendRe.exec(reply)) !== null) {
        const before = reply.slice(lastIdx, match.index).trim();
        if (before) fragments.push({ type:'text', content: before });
        fragments.push({ type:'card', title: match[1], year: match[2], mtype: match[3].toLowerCase().includes('movie') ? 'movie' : 'tv' });
        lastIdx = match.index + match[0].length;
    }
    const after = reply.slice(lastIdx).trim();
    if (after) fragments.push({ type:'text', content: after });
    if (!fragments.length) fragments.push({ type:'text', content: reply });

    for (const frag of fragments) {
        if (frag.type === 'text' && frag.content) {
            const el = document.createElement('div');
            el.className = 'zesty-msg-bot';
            el.innerHTML = mdToHtml(frag.content) || frag.content;
            zestyMessages.appendChild(el);
        } else if (frag.type === 'card') {
            // Search TMDB for the card
            const data = await TMDB.searchMulti(frag.title);
            const r = data.results?.find(x=>x.media_type==='movie'||x.media_type==='tv');
            if (r) {
                const card = document.createElement('div');
                card.className = 'zesty-canvas-card';
                const poster = r.poster_path ? `https://image.tmdb.org/t/p/w300${r.poster_path}` : '';
                const displayTitle = r.name || r.title;
                const year = (r.first_air_date||r.release_date||'').slice(0,4);
                const typeLabel = r.media_type==='movie'?'🎬 Movie':'📺 TV Show';
                card.innerHTML = `
                    ${poster ? `<img class="canvas-card-img" src="${poster}" alt="${displayTitle}">` : ''}
                    <div class="canvas-card-body">
                        <div class="canvas-card-title">${displayTitle}</div>
                        <div class="canvas-card-meta">${typeLabel} ${year ? '· '+year : ''} · ⭐ ${r.vote_average?.toFixed(1)||'?'}</div>
                        <div class="canvas-card-tap">▶ Tap to watch</div>
                    </div>`;
                card.addEventListener('click', () => {
                    mediaId = r.id; mediaType = r.media_type;
                    loadMedia(r.id, r.media_type);
                    zestyPanel.classList.remove('open');
                    window.scrollTo({top:0, behavior:'smooth'});
                });
                zestyMessages.appendChild(card);
            } else {
                // Fallback text
                const el = document.createElement('div');
                el.className = 'zesty-msg-bot';
                el.textContent = `🎬 ${frag.title} (${frag.year})`;
                zestyMessages.appendChild(el);
            }
        }
    }
    zestyMessages.scrollTop = zestyMessages.scrollHeight;
}

async function sendZesty() {
    const txt = zestyInput.value.trim(); if(!txt) return;
    // User bubble
    const uMsg = document.createElement('div'); uMsg.className = 'zesty-msg-user'; uMsg.textContent = txt;
    zestyMessages.appendChild(uMsg); zestyInput.value = '';
    chatHistory.push({ role:'user', content: txt });
    zestyMessages.scrollTop = zestyMessages.scrollHeight;

    // Thinking bubble
    const thinking = document.createElement('div'); thinking.className = 'zesty-msg-bot thinking-dots';
    thinking.textContent = 'Thinking';
    zestyMessages.appendChild(thinking);
    zestyMessages.scrollTop = zestyMessages.scrollHeight;

    const reply = await AI.chat(chatHistory);
    thinking.remove();
    chatHistory.push({ role:'assistant', content: reply });
    await parseAndRenderReply(reply);
}

zestySend.addEventListener('click', sendZesty);
zestyInput.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendZesty(); } });

// Prevent keyboard zoom on zesty panel open
zestyInput.addEventListener('focus', () => {
    if (window.innerWidth <= 768) {
        setTimeout(() => {
            zestyPanel.scrollIntoView({ behavior:'smooth', block:'nearest' });
        }, 300);
    }
});

   INIT
═══════════════════════════════════════════════════ */
renderLib();
loadMedia(mediaId, mediaType);
</script>
