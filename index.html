<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZestFlix - Cozy Cafe Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

        /* ===== CSS VARIABLES ===== */
        :root {
            --bg-deep: #5C4033;
            --nav-bg: rgba(253, 245, 230, 0.95);
            --panel-bg: rgba(253, 245, 230, 0.9);
            --accent-primary: #D4A373;
            --accent-secondary: #7FA998;
            --accent-hover: #E6CCB2;
            --accent-ai: #A093A6;
            --danger: #D96C6C;
            --input-bg: #FFFFFF;
            --border-color: #A67B5B;
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            --wood-light: #c9956b;
            --wood-dark: #8b5e3c;
            --cream: #FFF6EB;
            --bubbly-radius: 30px;
            --card-radius: 20px;
            --shadow-3d: 0 4px 0 rgba(62, 39, 35, 0.15);
            --shadow-float: 0 10px 25px rgba(62, 39, 35, 0.2);
            --shadow-glow: 0 0 15px rgba(224, 122, 95, 0.4);
            --shadow-ai: 0 0 15px rgba(157, 129, 137, 0.5);
        }

        /* ===== RESET & ZOOM PREVENTION ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', system-ui, sans-serif; }
        html {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            overflow-x: hidden;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        /* Prevent iOS auto-zoom on input focus (must be 16px+) */
        input, select, textarea, button {
            font-size: 16px !important;
            touch-action: manipulation;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(157, 129, 137, 0.3), var(--shadow-3d); }
            50% { box-shadow: 0 0 20px rgba(157, 129, 137, 0.7), var(--shadow-3d); }
        }
        @keyframes breatheBG {
            0% { background-position: center top; }
            100% { background-position: center bottom; }
        }
        @keyframes popIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== BACKGROUNDS ===== */
        .background-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; background-size: cover; background-position: center;
            filter: blur(30px) brightness(0.8) sepia(0.3);
            transition: background-image 1s ease-in-out; transform: scale(1.1);
        }
        .cozy-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(212, 163, 115, 0.3) 0%, rgba(92, 64, 51, 0.95) 100%);
            background-size: 100% 200%;
            animation: breatheBG 15s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            width: 95%; max-width: 1600px; margin: 16px auto;
            padding: 12px 20px; background-color: var(--nav-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 3px solid var(--border-color); border-radius: var(--bubbly-radius);
            box-shadow: var(--shadow-float), var(--shadow-3d);
            z-index: 100; flex-wrap: nowrap; gap: 16px;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; flex-shrink: 0; }
        .nav-right { display: flex; align-items: center; flex-shrink: 1; min-width: 0; }
        .logo {
            font-size: 36px; font-weight: 700; font-family: 'Fredoka', sans-serif;
            color: var(--text-main); display: flex; align-items: center; gap: 2px;
            margin-right: 12px; white-space: nowrap; line-height: 1; padding-bottom: 4px;
        }

        /* ===== BUTTONS & INPUTS ===== */
        input, .action-btn {
            background-color: var(--input-bg); color: var(--text-main);
            border: 3px solid var(--border-color); padding: 10px 20px;
            border-radius: var(--bubbly-radius); outline: none;
            font-size: 16px !important; font-weight: 800;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-3d); cursor: pointer;
        }
        input { cursor: text; transition: all 0.2s ease; color: var(--text-main); }
        input::placeholder { color: #A1887F; }
        input:hover, .action-btn:hover {
            border-color: var(--accent-primary); transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 0 rgba(62, 39, 35, 0.15), var(--shadow-glow);
        }
        input:focus, .action-btn:active {
            background-color: var(--input-bg); border-color: var(--accent-secondary);
            transform: translateY(2px) scale(0.98); box-shadow: 0 2px 0 rgba(62, 39, 35, 0.15);
        }
        .action-btn { background-color: var(--accent-hover); color: var(--text-main); border-color: var(--border-color); }
        .action-btn.active-fav { background-color: var(--danger); border-color: var(--danger); color: white; box-shadow: 0 0 15px rgba(217, 108, 108, 0.4), var(--shadow-3d); }
        .action-btn.ai-btn { border-color: var(--accent-ai); background: var(--accent-ai); color: white; }
        .action-btn.ai-btn:hover { border-color: #B5A8BB; box-shadow: 0 6px 0 rgba(62, 39, 35, 0.15), var(--shadow-ai); }

        /* ===== DROPDOWNS ===== */
        .dropdown-container { display: flex; gap: 12px; }
        .custom-dropdown { position: relative; min-width: 130px; user-select: none; }
        .dropdown-header {
            background-color: var(--accent-secondary); color: white;
            border: 3px solid var(--accent-secondary);
            padding: 10px 16px; border-radius: var(--bubbly-radius);
            font-size: 16px !important; font-weight: 800;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-3d); text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        .dropdown-header:hover { background-color: #8EBEAB; border-color: #8EBEAB; transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 0 rgba(62, 39, 35, 0.15); }
        .dropdown-header.disabled { opacity: 0.6; pointer-events: none; box-shadow: none; transform: none; background: #BCAAA4; border-color: #A1887F; }
        .dropdown-list {
            position: absolute; top: calc(100% + 8px); left: 0; width: 100%;
            background: var(--nav-bg); backdrop-filter: blur(20px);
            border: 3px solid var(--border-color); border-radius: 16px;
            box-shadow: var(--shadow-float); max-height: 300px; overflow-y: auto;
            z-index: 300; display: none; flex-direction: column; padding: 8px;
        }
        .dropdown-list.show { display: flex; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .dropdown-item { padding: 10px 12px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 14px; transition: all 0.2s; color: var(--text-main); }
        .dropdown-item:hover, .dropdown-item.selected { background-color: var(--accent-hover); color: var(--text-main); transform: translateX(4px); }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgba(62, 39, 35, 0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        /* ===== SEARCH ===== */
        .search-container { position: relative; width: 100%; max-width: 320px; display: flex; align-items: center; gap: 8px; flex-shrink: 1; }
        .ai-toggle-btn {
            background: var(--accent-ai); border: 3px solid var(--accent-ai); color: white;
            width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-3d); flex-shrink: 0; padding: 0 !important;
        }
        .ai-toggle-btn.active {
            background: var(--accent-ai); border-color: var(--accent-ai);
            animation: pulseGlow 2s infinite; transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(62, 39, 35, 0.15);
        }
        .ai-toggle-btn:hover:not(.active) { transform: scale(1.1); background-color: #B5A8BB; }
        .search-input-wrapper { position: relative; flex: 1; }
        .search-input { width: 100%; padding-right: 40px; }
        .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; pointer-events: none; transition: transform 0.3s ease; }
        .search-input:focus + .search-icon { transform: translateY(-50%) scale(1.2) rotate(10deg); }
        .search-results {
            position: absolute; top: calc(100% + 12px); right: 0;
            width: 100%; min-width: 280px; max-height: 350px;
            background-color: var(--nav-bg); backdrop-filter: blur(24px);
            border: 3px solid var(--border-color); border-radius: var(--card-radius);
            overflow-y: auto; overflow-x: hidden; box-shadow: var(--shadow-float);
            display: none; flex-direction: column; padding: 8px; z-index: 200;
        }
        .search-results.active { display: flex; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .search-item { display: flex; gap: 12px; padding: 10px; cursor: pointer; border-radius: 12px; transition: all 0.2s; border: 2px solid transparent; position: relative; background: white; }
        .search-item:hover { background-color: var(--accent-hover); border-color: var(--accent-primary); transform: translateX(5px); }
        .search-item img { width: 45px; height: 65px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 4px rgba(62, 39, 35, 0.2); }
        .item-info { display: flex; flex-direction: column; justify-content: center; padding-right: 30px; }
        .item-title { font-size: 15px; font-weight: 900; color: var(--text-main); margin-bottom: 2px; }
        .item-year { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .type-badge { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 18px; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1; padding: 0 0 24px; display: flex;
            flex-direction: column; align-items: center; gap: 20px;
            width: 95%; max-width: 1600px; margin: 0 auto;
        }

        /* ===== IFRAME PLAYER ===== */
        .iframe-wrapper {
            width: 100%; height: 65vh; min-height: 300px; position: relative;
            background-color: #2D1B15;
            border-radius: var(--card-radius); overflow: hidden;
            border: 8px solid var(--border-color);
            box-shadow: var(--shadow-float), 0 0 40px rgba(62, 39, 35, 0.4),
                        inset 0 0 0 2px rgba(201, 149, 107, 0.4);
            background: linear-gradient(135deg, var(--wood-light), var(--wood-dark));
            padding: 4px;
        }
        .iframe-inner {
            width: 100%; height: 100%; position: relative;
            border-radius: 12px; overflow: hidden;
            background: #1a0f0a;
        }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* ===== SHOW INFO ===== */
        .show-info {
            width: 100%; padding: 28px; margin-top: 10px;
            background: var(--panel-bg); backdrop-filter: blur(16px);
            border-radius: var(--card-radius); border: 3px solid var(--border-color);
            box-shadow: var(--shadow-float);
            display: flex; flex-direction: column; gap: 16px;
            position: relative; transition: all 0.3s;
        }
        .show-info:hover { border-color: var(--accent-primary); box-shadow: 0 15px 35px rgba(62, 39, 35, 0.25); }
        .info-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .title-group { display: flex; flex-direction: column; gap: 10px; }
        .show-title { font-size: 42px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: var(--text-main); letter-spacing: -0.5px; line-height: 1.1; }
        .badges-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge {
            background: rgba(62, 39, 35, 0.06); padding: 8px 16px; border-radius: 50px;
            font-size: 14px; font-weight: 800; color: var(--text-muted);
            display: inline-flex; align-items: center; gap: 6px; border: none; box-shadow: none;
        }
        .badge.rating { background: rgba(229, 169, 59, 0.15); color: #B37D1E; }
        .badge.status { background: rgba(127, 169, 152, 0.15); color: var(--accent-secondary); }
        .badge.genre-badge { background: rgba(212, 163, 115, 0.2); color: var(--text-main); }
        .emoji-icon { font-size: 1.3em; display: inline-flex; align-items: center; }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .show-overview {
            font-size: 16px; line-height: 1.7; font-weight: 700;
            background: rgba(255,255,255,0.6); padding: 20px;
            border-radius: 16px; border-left: 6px solid var(--accent-primary);
            color: var(--text-main);
        }
        .ai-insights-panel {
            display: none; margin-top: 10px; padding: 20px;
            background: var(--accent-ai); border: 3px solid #8C737A;
            border-radius: 16px; font-size: 15px; font-weight: 700;
            line-height: 1.6; color: white; white-space: pre-line;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }

        /* ===== BACKPACK / LIBRARY ===== */
        .library-section {
            width: 100%; padding: 20px 24px;
            background: rgba(253, 245, 230, 0.7); backdrop-filter: blur(10px);
            border-radius: var(--card-radius); border: 3px dashed var(--border-color);
            display: flex; flex-direction: column; gap: 12px;
            transition: border-color 0.3s; box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
        }
        .library-section:hover { border-color: var(--accent-primary); }
        .library-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .library-title {
            font-size: 38px; font-weight: 700; font-family: 'Fredoka', sans-serif;
            color: var(--text-main); display: flex; align-items: center; gap: 12px;
            letter-spacing: -0.5px; line-height: 1;
        }
        .empty-library { font-size: 16px; color: var(--text-muted); font-weight: 800; padding: 30px; text-align: center; background: rgba(255,255,255,0.6); border-radius: 16px; }
        .library-scroll {
            display: flex; gap: 20px; overflow-x: auto;
            padding: 20px 20px 30px 20px;
            scroll-behavior: smooth;
        }

        /* ===== LIBRARY CARDS (Cafe/Wood Theme) ===== */
        .library-card {
            min-width: 120px; max-width: 120px; position: relative;
            display: flex; flex-direction: column; gap: 6px; cursor: pointer;
        }
        .card-img-wrapper {
            position: relative; width: 100%; height: 175px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--wood-light) 0%, var(--wood-dark) 50%, var(--border-color) 100%);
            padding: 4px;
            box-shadow: 0 4px 12px rgba(62, 39, 35, 0.35), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: transform 0.2s ease;
        }
        .library-card:hover .card-img-wrapper { transform: translateY(-4px); }
        .library-card img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 10px; border: none;
            transition: all 0.3s;
        }
        .library-card.is-favorite .card-img-wrapper {
            background: linear-gradient(135deg, #e8a0a0, #c96868, #d48a8a);
        }
        .library-card.ai-pick .card-img-wrapper {
            background: linear-gradient(135deg, #b8a8c0, #8c7a94, #a093a6);
        }
        .fav-badge { position: absolute; top: -10px; left: -10px; font-size: 22px; filter: drop-shadow(0 2px 4px rgba(62, 39, 35, 0.3)); z-index: 5; color: #ef4444; }
        .progress-badge {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, var(--wood-light), var(--border-color));
            color: var(--cream); font-size: 11px; font-weight: 900;
            padding: 4px 10px; border-radius: 10px;
            box-shadow: 0 2px 6px rgba(62, 39, 35, 0.4);
            white-space: nowrap; border: 2px solid rgba(253, 245, 230, 0.7);
            z-index: 5; text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
            font-family: 'Fredoka', sans-serif;
        }
        .progress-badge.movie-badge {
            background: linear-gradient(135deg, var(--accent-secondary), #5e8a78);
        }
        .progress-badge.ai-badge {
            background: linear-gradient(135deg, var(--accent-ai), #8c7a94);
        }
        .remove-btn {
            position: absolute; top: -10px; right: -10px;
            background: var(--danger); color: white;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 15px; cursor: pointer;
            border: 3px solid white; box-shadow: 0 2px 4px rgba(62, 39, 35, 0.2);
            opacity: 0; transition: opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20; padding: 0 !important;
        }
        .library-card:hover .remove-btn { opacity: 1; }
        .remove-btn:hover { transform: scale(1.2); }
        .library-card-title {
            font-size: 13px; font-weight: 800; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: var(--text-main); transition: color 0.2s; padding: 5px 6px;
            background: rgba(253, 245, 230, 0.95);
            border-radius: 10px; border: 2px solid var(--border-color);
            font-family: 'Fredoka', sans-serif;
        }
        .library-card:hover .library-card-title { color: var(--accent-primary); border-color: var(--accent-primary); }
        .ai-recs-container { display: none; background: rgba(255, 255, 255, 0.5); border: 3px solid var(--accent-ai); border-radius: 16px; padding: 15px; margin-top: 10px; }

        /* ===== ZESTY AI CHAT ===== */
        .zesty-toggle {
            position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
            background: var(--accent-secondary); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; cursor: pointer;
            box-shadow: var(--shadow-float), 0 0 15px rgba(129, 178, 154, 0.4);
            border: 3px solid white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999; animation: float 4s ease-in-out infinite;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.1); padding: 0 !important;
        }
        .zesty-toggle:hover { transform: scale(1.15) rotate(10deg); animation: none; }
        .zesty-panel {
            position: fixed; bottom: 110px; right: 30px; width: 380px; height: 520px;
            background: var(--nav-bg); backdrop-filter: blur(20px);
            border: 3px solid var(--accent-secondary);
            border-radius: var(--card-radius); box-shadow: var(--shadow-float);
            z-index: 998; display: none; flex-direction: column; overflow: hidden;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .zesty-header {
            background: var(--accent-secondary); padding: 15px;
            font-weight: 900; color: white; display: flex; justify-content: space-between;
            border-bottom: 3px solid white; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
            font-size: 18px;
        }
        .zesty-messages {
            flex: 1; padding: 15px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 12px; background: rgba(255,255,255,0.4);
        }
        .msg {
            max-width: 85%; padding: 12px 16px; border-radius: 16px;
            font-size: 14px; font-weight: 800; line-height: 1.5;
            box-shadow: 0 2px 4px rgba(62, 39, 35, 0.1); word-wrap: break-word;
        }
        .msg.bot {
            background: white; color: var(--text-main); align-self: flex-start;
            border-bottom-left-radius: 4px; border: 2px solid var(--border-color);
        }
        .msg.user {
            background: var(--accent-primary); color: white; align-self: flex-end;
            border-bottom-right-radius: 4px; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }
        .zesty-input-area {
            padding: 15px; border-top: 3px solid white; display: flex; gap: 8px;
            background: rgba(255,255,255,0.8);
        }
        .zesty-input-area input {
            flex: 1; padding: 10px 16px; border-radius: 20px;
            font-size: 16px !important; font-weight: 800; border: 2px solid var(--border-color);
            transition: border 0.2s; background: white;
        }
        .zesty-input-area input:focus { border-color: var(--accent-secondary); }
        .zesty-input-area .action-btn {
            background: var(--accent-secondary); border-color: #6E9B85; color: white;
            padding: 10px 16px !important;
        }

        /* ===== ZESTY RECOMMENDATION CARDS ===== */
        .zesty-picks-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 10px; padding: 8px; max-width: 95%;
            align-self: flex-start;
        }
        .zesty-pick-card {
            background: linear-gradient(145deg, var(--cream), #F5E6D3);
            border-radius: 14px; overflow: hidden;
            border: 3px solid var(--border-color); cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 3px 10px rgba(62, 39, 35, 0.2);
        }
        .zesty-pick-card:hover, .zesty-pick-card:active {
            border-color: var(--accent-primary);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(62, 39, 35, 0.3);
        }
        .zesty-pick-card img {
            width: 100%; height: 120px; object-fit: cover;
            border-bottom: 2px solid var(--border-color);
        }
        .zesty-pick-info { padding: 8px; text-align: center; }
        .zesty-pick-title {
            font-size: 12px; font-weight: 800; color: var(--text-main);

    <!-- ZESTY AI CHAT -->

        </div>

            <div class="msg bot">Hey! I'm Zesty 🍋 Tell me what kind of mood you're in, and I'll find the perfect movie or show for you! Just click any card I suggest to start watching! 🍿</div>
        </div>
        <div class="zesty-input-area">
            <input type="text" id="zesty-input" placeholder="E.g., I want a scary movie...">
            <button class="action-btn" id="zesty-send">Send</button>
        </div>
    </div>

    <script>
        /* ===== CONFIGURATION ===== */
        // API key (obfuscated - not plainly visible in source)
        const _c = [65,73,122,97,83,121,66,77,82,103,118,109,118,76,50,102,79,56,101,69,53,112,101,57,57,113,88,98,82,104,105,81,110,79,57,80,74,79,111];
        const _ak = _c.map(x => String.fromCharCode(x)).join('');
        const GEMINI_MODEL = 'gemini-1.5-flash';
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${_ak}`;

        /* ===== SERVICES ===== */
        const BackendService = {
            TMDB_KEY: 'd62d816a3f48ed18c1dc5e157f4d73b2',
            BASE: 'https://api.themoviedb.org/3',
            async searchMulti(query) {
                const res = await fetch(`${this.BASE}/search/multi?api_key=${this.TMDB_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
                return res.json();
            },
            async getDetails(id, type) {
                const res = await fetch(`${this.BASE}/${type}/${id}?api_key=${this.TMDB_KEY}`);
                return res.json();
            },
            async getEpisodes(tvId, seasonNum) {
                const res = await fetch(`${this.BASE}/tv/${tvId}/season/${seasonNum}?api_key=${this.TMDB_KEY}`);
                return res.json();
            }
        };

        const GeminiService = {
            async call(prompt, systemPrompt = null) {
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                if (systemPrompt) {
                    payload.systemInstruction = { parts: [{ text: systemPrompt }] };
                }
                try {
                    const res = await fetch(GEMINI_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                } catch (e) {
                    console.error('Gemini error:', e);
                    return null;
                }
            },

            async callChat(history, systemPrompt) {
                const payload = {
                    contents: history,
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };
                try {
                    const res = await fetch(GEMINI_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                } catch (e) {
                    console.error('Gemini chat error:', e);
                    return null;
                }
            },

            async smartSearch(query) {
                const prompt = `A user wants to find a movie or TV show. They typed: "${query}". Identify the exact title of the most likely movie or TV show they mean. Return ONLY raw JSON, no markdown, no code blocks: {"title": "Exact Title"}`;
                const result = await this.call(prompt);
                if (!result) return query;
                try {
                    const clean = result.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(clean);
                    return parsed.title || query;
                } catch { return query; }
            },

            async getInsights(title, type, year) {
                const prompt = `Give 3 spoiler-free fun facts and a short 1-sentence pitch on why someone should watch the ${type} "${title}" (${year}). Format: A short paragraph, followed by bullet points.`;
                const sys = "You are an enthusiastic movie expert. Be concise and spoiler-free.";
                const result = await this.call(prompt, sys);
                return result || "The oracle is sleeping. Try again!";
            },

            async getRecommendations(titles) {
                const prompt = `Based on: ${titles.join(', ')}. Recommend 4 similar movies or TV shows. Return ONLY a JSON array of strings containing exact titles. No markdown, no code blocks.`;
                const result = await this.call(prompt);
                if (!result) return [];
                try {
                    const clean = result.replace(/```json/gi, '').replace(/```/g, '').trim();
                    return JSON.parse(clean);
                } catch { return []; }
            }
        };

        /* ===== STATE ===== */
        let currentMediaId = 37680;
        let currentMediaType = 'tv';
        let currentMediaTitle = 'Suits';
        let currentMediaYear = '2011';
        let currentSeasonVal = null;
        let currentEpisodeVal = null;
        let searchTimeout = null;
        let isAiSearchEnabled = false;
        let chatHistory = [];

        /* ===== DOM REFERENCES ===== */
        const $ = id => document.getElementById(id);
        const searchInput = $('search-input');
        const searchResults = $('search-results');
        const playerFrame = $('player-frame');
        const bgBackdrop = $('bg-backdrop');
        const infoTitle = $('info-title');
        const infoYear = $('info-year');
        const infoRating = $('info-rating');
        const infoStatus = $('info-status');
        const infoOverview = $('info-overview');
        const infoType = $('info-type');
        const badgesContainer = $('badges-container');
        const libraryScroll = $('library-scroll');
        const favBtn = $('fav-btn');
        const shareBtn = $('share-btn');
        const dropdownGroup = $('dropdown-group');
        const seasonHeader = $('season-header');
        const seasonList = $('season-list');
        const episodeHeader = $('episode-header');
        const episodeList = $('episode-list');
        const aiSearchToggle = $('ai-search-toggle');
        const aiInsightsBtn = $('ai-insights-btn');
        const aiInsightsPanel = $('ai-insights-panel');
        const aiRecsBtn = $('ai-recs-btn');
        const aiRecsContainer = $('ai-recs-container');
        const aiRecsScroll = $('ai-recs-scroll');
        const zestyToggle = $('zesty-toggle');
        const zestyPanel = $('zesty-panel');
        const zestyClose = $('zesty-close');
        const zestyMessages = $('zesty-messages');
        const zestyInput = $('zesty-input');
        const zestySend = $('zesty-send');

        /* ===== ZOOM PREVENTION (iOS) ===== */
        document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', function(e) {
            if (e.scale !== undefined && e.scale !== 1) { e.preventDefault(); }
        }, { passive: false });

        // Handle visual viewport for keyboard on iOS
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                if (zestyPanel.style.display === 'flex') {
                    zestyPanel.style.height = window.visualViewport.height + 'px';
                    zestyPanel.style.top = window.visualViewport.offsetTop + 'px';
                }
            });
            window.visualViewport.addEventListener('scroll', () => {
                if (zestyPanel.style.display === 'flex') {
                    zestyPanel.style.top = window.visualViewport.offsetTop + 'px';
                }
            });
        }

        /* ===== INIT ===== */
        async function init() {
            renderLibrary();
            await loadMediaDetails(currentMediaId, currentMediaType);
        }

        /* ===== DROPDOWNS ===== */
        function toggleDropdown(listElem) {
            if (listElem !== seasonList) seasonList.classList.remove('show');
            if (listElem !== episodeList) episodeList.classList.remove('show');
            listElem.classList.toggle('show');
        }
        seasonHeader.addEventListener('click', () => {
            if (!seasonHeader.classList.contains('disabled')) toggleDropdown(seasonList);
        });
        episodeHeader.addEventListener('click', () => {
            if (!episodeHeader.classList.contains('disabled')) toggleDropdown(episodeList);
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-dropdown')) {
                seasonList.classList.remove('show');
                episodeList.classList.remove('show');
            }
            if (!e.target.closest('.search-container')) {
                searchResults.classList.remove('active');
            }
        });

        function populateSeasonDropdown(seasons, targetSeason) {
            seasonList.innerHTML = '';
            seasons.forEach(season => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.textContent = `Season ${season.season_number}`;
                if (season.season_number == targetSeason) item.classList.add('selected');
                item.addEventListener('click', () => {
                    currentSeasonVal = season.season_number;
                    seasonHeader.innerHTML = `Season ${currentSeasonVal} <span>▼</span>`;
                    seasonList.classList.remove('show');
                    loadEpisodes(currentMediaId, currentSeasonVal);
                });
                seasonList.appendChild(item);
            });
            seasonHeader.classList.remove('disabled');
        }

        function populateEpisodeDropdown(episodes, targetEpisode) {
            episodeList.innerHTML = '';
            episodes.forEach(ep => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                const name = ep.name.length > 20 ? ep.name.substring(0, 20) + '...' : ep.name;
                item.textContent = `Ep ${ep.episode_number}: ${name}`;
                if (ep.episode_number == targetEpisode) item.classList.add('selected');
                item.addEventListener('click', () => {
                    currentEpisodeVal = ep.episode_number;
                    episodeHeader.innerHTML = `Ep ${currentEpisodeVal} <span>▼</span>`;
                    episodeList.classList.remove('show');
                    updatePlayer();
                });
                episodeList.appendChild(item);
            });
            episodeHeader.classList.remove('disabled');
        }

        /* ===== LIBRARY (BACKPACK) ===== */
        function getLibrary() {
            return JSON.parse(localStorage.getItem('streamToyLibrary') || '[]');
        }
        function saveLibrary(lib) {
            localStorage.setItem('streamToyLibrary', JSON.stringify(lib));
            renderLibrary();
            updateFavBtnUI();
        }
        function updateLibraryData(data, mediaType, season = 1, episode = 1) {
            let library = getLibrary();
            let existing = library.find(item => item.id == data.id && item.mediaType === mediaType);
            let isFav = existing ? existing.favorite : false;
            library = library.filter(item => !(item.id == data.id && item.mediaType === mediaType));
            library.unshift({
                id: data.id, name: data.name || data.title,
                poster: data.poster_path, mediaType: mediaType,
                season: season, episode: episode, favorite: isFav
            });
            if (library.length > 20) library.pop();
            saveLibrary(library);
        }
        function updateLibraryProgress(id, season, episode) {
            if (currentMediaType === 'movie') return;
            let library = getLibrary();
            const index = library.findIndex(item => item.id == id && item.mediaType === 'tv');
            if (index !== -1) {
                library[index].season = season;
                library[index].episode = episode;
                saveLibrary(library);
            }
        }
        function toggleFavorite(id) {
            let library = getLibrary();
            const index = library.findIndex(item => item.id == id && item.mediaType === currentMediaType);
            if (index !== -1) {
                library[index].favorite = !library[index].favorite;
                saveLibrary(library);
            }
        }
        function removeFromLibrary(id, type) {
            let library = getLibrary();
            library = library.filter(item => !(item.id == id && item.mediaType === type));
            saveLibrary(library);
        }

        function renderLibrary() {
            let library = getLibrary();
            libraryScroll.innerHTML = '';
            if (library.length === 0) {
                libraryScroll.innerHTML = `<div class="empty-library">Your backpack is empty! 🏕 Find a movie or show to add it here.</div>`;
                return;
            }
            library.sort((a, b) => (b.favorite === true) - (a.favorite === true));
            library.forEach(item => {
                const card = document.createElement('div');
                card.className = `library-card ${item.favorite ? 'is-favorite' : ''}`;
                const posterUrl = item.poster ? `https://image.tmdb.org/t/p/w200${item.poster}` : '';
                const favIcon = item.favorite ? `<div class="fav-badge">❤️</div>` : '';
                const badgeClass = item.mediaType === 'tv' ? 'progress-badge' : 'progress-badge movie-badge';
                const badgeText = item.mediaType === 'tv'
                    ? `S${item.season || 1} E${item.episode || 1}`
                    : '🎬 Movie';
                const noImgSvg = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='300' style='background:%23FFF6EB'%3E%3Ctext fill='%23A67B5B' x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3ENo Poster%3C/text%3E%3C/svg%3E`;

                card.innerHTML = `
                    <div class="remove-btn" title="Remove">&times;</div>
                    <div class="card-img-wrapper">
                        ${favIcon}
                        <img src="${posterUrl}" onerror="this.src='${noImgSvg}'">
                        <div class="${badgeClass}">${badgeText}</div>
                    </div>
                    <div class="library-card-title">${item.name}</div>
                `;
                card.querySelector('.remove-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeFromLibrary(item.id, item.mediaType);
                });
                card.addEventListener('click', () => {
                    currentMediaId = item.id;
                    currentMediaType = item.mediaType;
                    loadMediaDetails(item.id, item.mediaType, item.season, item.episode);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                libraryScroll.appendChild(card);
            });
        }

        /* ===== SEARCH ===== */
        aiSearchToggle.addEventListener('click', () => {
            isAiSearchEnabled = !isAiSearchEnabled;
            aiSearchToggle.classList.toggle('active');
            searchInput.placeholder = isAiSearchEnabled ? "✨ Describe what you want..." : "Find a movie or show...";
        });

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (query.length >= 2) {
                const delay = isAiSearchEnabled ? 1200 : 400;
                searchTimeout = setTimeout(() => fetchSearchResults(query), delay);
            } else {
                searchResults.classList.remove('active');
            }
        });

        async function fetchSearchResults(query) {
            searchResults.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--accent-primary); font-weight:800;">Searching...</div>';
            searchResults.classList.add('active');

            let finalQuery = query;
            if (isAiSearchEnabled) {
                const aiResult = await GeminiService.smartSearch(query);
                if (aiResult) finalQuery = aiResult;
            }

            try {
                const data = await BackendService.searchMulti(finalQuery);
                searchResults.innerHTML = '';
                const filtered = data.results ? data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv') : [];

                if (filtered.length === 0) {
                    searchResults.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--danger); font-weight:800;">Not found! Try different words.</div>';
                    return;
                }

                const noImgSvg = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='92' height='138' style='background:%23FFF6EB'%3E%3C/svg%3E`;
                filtered.slice(0, 6).forEach(item => {
                    const searchCard = document.createElement('div');
                    searchCard.className = 'search-item';
                    const poster = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : '';
                    const title = item.name || item.title;
                    const releaseDate = item.first_air_date || item.release_date;
                    const year = releaseDate ? releaseDate.substring(0, 4) : 'N/A';
                    const typeIcon = item.media_type === 'movie' ? '🎬' : '📺';

                    searchCard.innerHTML = `
                        <img src="${poster}" onerror="this.src='${noImgSvg}'">
                        <div class="item-info">
                            <div class="item-title">${title}</div>
                            <div class="item-year">${year}</div>
                        </div>
                        <div class="type-badge">${typeIcon}</div>
                    `;
                    searchCard.addEventListener('click', () => {
                        currentMediaId = item.id;
                        currentMediaType = item.media_type;
                        searchInput.value = '';
                        searchResults.classList.remove('active');
                        loadMediaDetails(currentMediaId, currentMediaType);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                    searchResults.appendChild(searchCard);
                });
            } catch (err) {
                searchResults.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--danger); font-weight:800;">Search error. Try again!</div>';
            }
        }

        /* ===== AI FEATURES ===== */
        // AI Insights
        aiInsightsBtn.addEventListener('click', async () => {
            if (aiInsightsPanel.style.display === 'block') {
                aiInsightsPanel.style.display = 'none'; return;
            }
            aiInsightsPanel.style.display = 'block';
            aiInsightsPanel.innerHTML = "✨ Conjuring insights with AI...";
            const text = await GeminiService.getInsights(
                currentMediaTitle,
                currentMediaType === 'tv' ? 'TV Show' : 'Movie',
                currentMediaYear
            );
            aiInsightsPanel.innerHTML = text;
        });

        // AI Picks for Backpack
        aiRecsBtn.addEventListener('click', async () => {
            const library = getLibrary();
            if (library.length === 0) { alert("Add some shows to your Backpack first!"); return; }
            aiRecsContainer.style.display = 'block';
            aiRecsScroll.innerHTML = '<div style="color: var(--accent-ai); padding: 15px; font-weight:900;">✨ Reading your mind...</div>';

            const titles = library.map(i => i.name).slice(0, 10);
            const recommendedTitles = await GeminiService.getRecommendations(titles);
            aiRecsScroll.innerHTML = '';

            if (!recommendedTitles || recommendedTitles.length === 0) {
                aiRecsScroll.innerHTML = '<div style="color: var(--danger); padding: 15px; font-weight:900;">The oracle failed. Try again!</div>';
                return;
            }

            const noImgSvg = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='300' style='background:%23FFF6EB'%3E%3Ctext fill='%23A67B5B' x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3ENo Poster%3C/text%3E%3C/svg%3E`;

            for (const title of recommendedTitles) {
                try {
                    const searchData = await BackendService.searchMulti(title);
                    const firstResult = searchData.results?.find(r => r.media_type === 'movie' || r.media_type === 'tv');
                    if (firstResult) {
                        const card = document.createElement('div');
                        card.className = 'library-card ai-pick';
                        const posterUrl = firstResult.poster_path ? `https://image.tmdb.org/t/p/w200${firstResult.poster_path}` : '';
                        const badgeText = firstResult.media_type === 'tv' ? '✨ TV' : '✨ Movie';
                        card.innerHTML = `
                            <div class="card-img-wrapper">
                                <img src="${posterUrl}" onerror="this.src='${noImgSvg}'">
                                <div class="progress-badge ai-badge">${badgeText}</div>
                            </div>
                            <div class="library-card-title">${firstResult.name || firstResult.title}</div>
                        `;
                        card.addEventListener('click', () => {
                            currentMediaId = firstResult.id;
                            currentMediaType = firstResult.media_type;
                            loadMediaDetails(firstResult.id, firstResult.media_type);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        });
                        aiRecsScroll.appendChild(card);
                    }
                } catch (e) { console.error('Rec card error:', e); }
            }
        });

        /* ===== ZESTY AI CHAT ===== */
        const ZESTY_SYSTEM = `You are Zesty 🍋, the fun movie/TV assistant for ZestFlix, a cozy cafe-themed streaming site.

CRITICAL: Always respond in this EXACT JSON format with no markdown, no code blocks, just raw JSON:
{"message": "Your fun response here with emojis", "picks": ["Exact Movie Title 1", "Exact Show Title 2"]}

Rules:
- "message" = your friendly chat response (short, fun, with emojis)
- "picks" = array of exact movie/TV show title strings you recommend (use empty array [] if not recommending)
- When users ask for recommendations, describe a mood, genre, or say "what should I watch", ALWAYS include 2-4 picks
- Tell them to click the cards to start watching on ZestFlix
- Be enthusiastic, fun, use emojis, keep it brief
- For casual chat (hi, thanks, bye), use empty picks array []
- NEVER use markdown formatting, just plain text`;

        zestyToggle.addEventListener('click', () => { zestyPanel.style.display = 'flex'; });
        zestyClose.addEventListener('click', () => {
            zestyPanel.style.display = 'none';
            zestyPanel.style.height = '';
            zestyPanel.style.top = '';
        });

        function appendMsg(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            zestyMessages.appendChild(div);
            zestyMessages.scrollTop = zestyMessages.scrollHeight;
        }

        async function createPickCards(titles) {
            if (!titles || titles.length === 0) return;
            const grid = document.createElement('div');
            grid.className = 'zesty-picks-grid';

            const noImgSvg = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='300' style='background:%23FFF6EB'%3E%3Ctext fill='%23A67B5B' x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='14'%3ELoading...%3C/text%3E%3C/svg%3E`;

            for (const title of titles) {
                try {
                    const data = await BackendService.searchMulti(title);
                    const result = data.results?.find(r => r.media_type === 'movie' || r.media_type === 'tv');
                    if (result) {
                        const card = document.createElement('div');
                        card.className = 'zesty-pick-card';
                        const poster = result.poster_path ? `https://image.tmdb.org/t/p/w200${result.poster_path}` : noImgSvg;
                        const name = result.name || result.title;
                        const type = result.media_type === 'movie' ? '🎬 Movie' : '📺 TV Show';

                        card.innerHTML = `
                            <img src="${poster}" alt="${name}" onerror="this.style.background='var(--cream)'; this.style.height='80px';">
                            <div class="zesty-pick-info">
                                <div class="zesty-pick-title">${name}</div>
                                <div class="zesty-pick-type">${type}</div>
                                <div class="zesty-pick-watch">▶ Watch Now</div>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            currentMediaId = result.id;
                            currentMediaType = result.media_type;
                            loadMediaDetails(result.id, result.media_type);
                            zestyPanel.style.display = 'none';
                            zestyPanel.style.height = '';
                            zestyPanel.style.top = '';
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        });
                        grid.appendChild(card);
                    }
                } catch (e) { console.error('Pick card error:', e); }
            }
            if (grid.children.length > 0) {
                zestyMessages.appendChild(grid);
                zestyMessages.scrollTop = zestyMessages.scrollHeight;
            }
        }

        zestySend.addEventListener('click', async () => {
            const text = zestyInput.value.trim();
            if (!text) return;
            appendMsg(text, 'user');
            zestyInput.value = '';
            chatHistory.push({ role: "user", parts: [{ text }] });

            // Loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg bot';
            loadingDiv.textContent = '🍋 Thinking...';
            zestyMessages.appendChild(loadingDiv);
            zestyMessages.scrollTop = zestyMessages.scrollHeight;

            const response = await GeminiService.callChat(chatHistory, ZESTY_SYSTEM);
            loadingDiv.remove();

            if (!response) {
                appendMsg("Oops! I'm having trouble connecting right now. Try again! 🍋", 'bot');
                return;
            }

            // Try to parse as JSON with picks
            let handled = false;
            try {
                const clean = response.replace(/```json/gi, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(clean);
                if (parsed.message) {
                    appendMsg(parsed.message, 'bot');
                    handled = true;
                }
                if (parsed.picks && parsed.picks.length > 0) {
                    await createPickCards(parsed.picks);
                }
            } catch {
                // Not valid JSON, display as plain text
                if (!handled) {
                    appendMsg(response, 'bot');
                }
            }

            chatHistory.push({ role: "model", parts: [{ text: response }] });
        });

        zestyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') zestySend.click();
        });

        /* ===== UTILITIES ===== */
        function updateFavBtnUI() {
            let library = getLibrary();
            let current = library.find(item => item.id == currentMediaId && item.mediaType == currentMediaType);
            if (current && current.favorite) {
                favBtn.innerHTML = '<span class="emoji-icon" style="color: #ef4444;">❤️</span> Favorited';
                favBtn.classList.add('active-fav');
            } else {
                favBtn.innerHTML = '<span class="emoji-icon">🤍</span> Favorite';
                favBtn.classList.remove('active-fav');
            }
        }

        favBtn.addEventListener('click', () => toggleFavorite(currentMediaId));
        shareBtn.addEventListener('click', () => {
            const text = window.location.href;
            navigator.clipboard.writeText(text).then(() => {
                const original = shareBtn.innerHTML;
                shareBtn.innerHTML = '✅ Copied!';
                setTimeout(() => { shareBtn.innerHTML = original; }, 2000);
            });
        });

        /* ===== DATA LOADING ===== */
        async function loadMediaDetails(id, type, targetSeason = null, targetEpisode = null) {
            try {
                seasonHeader.classList.add('disabled');
                episodeHeader.classList.add('disabled');
                aiInsightsPanel.style.display = 'none';

                const data = await BackendService.getDetails(id, type);
                updateLibraryData(data, type, targetSeason || 1, targetEpisode || 1);

                if (data.backdrop_path) {
                    bgBackdrop.style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
                }

                currentMediaTitle = data.name || data.title;
                const releaseDate = data.first_air_date || data.release_date;
                currentMediaYear = releaseDate ? releaseDate.substring(0, 4) : 'N/A';

                infoTitle.textContent = currentMediaTitle;
                infoType.innerHTML = type === 'movie'
                    ? '<span class="emoji-icon">🎬</span> Movie'
                    : '<span class="emoji-icon">📺</span> TV Show';
                infoYear.innerHTML = `<span class="emoji-icon">📅</span> ${currentMediaYear}`;
                infoRating.innerHTML = data.vote_average
                    ? `<span class="emoji-icon">⭐</span> ${data.vote_average.toFixed(1)}/10`
                    : '<span class="emoji-icon">⭐</span> N/A';

                if (type === 'tv') {
                    infoStatus.style.display = 'inline-block';
                    infoStatus.innerHTML = data.status === 'Ended'
                        ? '<span class="emoji-icon">🔴</span> Ended'
                        : '<span class="emoji-icon">🟢</span> ' + data.status;
                } else {
                    infoStatus.style.display = 'none';
                }

                infoOverview.textContent = data.overview || 'No story available for this one! 🏕';

                document.querySelectorAll('.genre-badge').forEach(e => e.remove());
                if (data.genres) {
                    data.genres.slice(0, 3).forEach(g => {
                        const span = document.createElement('span');
                        span.className = 'badge genre-badge';
                        span.innerHTML = `<span class="emoji-icon">🎭</span> ${g.name}`;
                        badgesContainer.appendChild(span);
                    });
                }

                if (type === 'movie') {
                    dropdownGroup.style.display = 'none';
                    updatePlayer();
                } else {
                    dropdownGroup.style.display = 'flex';
                    const validSeasons = data.seasons ? data.seasons.filter(s => s.season_number > 0) : [];
                    if (validSeasons.length > 0) {
                        currentSeasonVal = targetSeason && validSeasons.find(s => s.season_number == targetSeason)
                            ? targetSeason : validSeasons[0].season_number;
                        seasonHeader.innerHTML = `Season ${currentSeasonVal} <span>▼</span>`;
                        populateSeasonDropdown(validSeasons, currentSeasonVal);
                        await loadEpisodes(id, currentSeasonVal, targetEpisode);
                    }
                }
                updateFavBtnUI();
            } catch (error) {
                console.error("Error loading details:", error);
            }
        }

        async function loadEpisodes(tvId, seasonNum, targetEpisode = null) {
            try {
                episodeHeader.classList.add('disabled');
                episodeHeader.innerHTML = '🎬 Loading... <span>▼</span>';
                const data = await BackendService.getEpisodes(tvId, seasonNum);
                if (data.episodes && data.episodes.length > 0) {
                    currentEpisodeVal = targetEpisode && data.episodes.find(e => e.episode_number == targetEpisode)
                        ? targetEpisode : data.episodes[0].episode_number;
                    episodeHeader.innerHTML = `Ep ${currentEpisodeVal} <span>▼</span>`;
                    populateEpisodeDropdown(data.episodes, currentEpisodeVal);
                    updatePlayer();
                }
            } catch (error) {
                console.error("Error loading episodes:", error);
            }
        }

        function updatePlayer() {
            if (currentMediaType === 'movie') {
                playerFrame.src = `https://vidfast.pro/movie/${currentMediaId}?autoPlay=true`;
            } else {
                if (!currentSeasonVal || !currentEpisodeVal) return;
                playerFrame.src = `https://vidfast.pro/tv/${currentMediaId}/${currentSeasonVal}/${currentEpisodeVal}?autoPlay=true&nextButton=true&autoNext=true`;
                updateLibraryProgress(currentMediaId, currentSeasonVal, currentEpisodeVal);
            }
        }

        /* ===== START ===== */
        init();
    </script>
</body>
</html>
