<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZestFlix - Cozy Cafe & Cinema Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

        :root {
            --bg-deep: #5C4033;
            --nav-bg: rgba(253,245,230,0.95);
            --panel-bg: rgba(253,245,230,0.9);
            --accent-primary: #D4A373;
            --accent-secondary: #7FA998;
            --accent-hover: #E6CCB2;
            --accent-ai: #6E9B85;
            --danger: #D96C6C;
            --input-bg: #FFFFFF;
            --border-color: #A67B5B;
            --frame-color: #3E2723;
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            --bubbly-radius: 30px;
            --card-radius: 20px;
            --shadow-3d: 0 4px 0 rgba(62,39,35,0.15);
            --shadow-float: 0 10px 25px rgba(62,39,35,0.2);
            /* Netflix Player vars */
            --nf-bg: #000;
            --nf-ctrl-bg: rgba(0,0,0,0.85);
            --nf-accent: #e50914;
            --nf-text: #fff;
            --nf-muted: rgba(255,255,255,0.6);
            --nf-panel-bg: rgba(20,20,20,0.97);
            --nf-border: rgba(255,255,255,0.12);
        }

        body.movie-mode {
            --bg-deep: #0a0e1a;
            --nav-bg: rgba(8,14,32,0.95);
            --panel-bg: rgba(8,14,32,0.88);
            --accent-primary: #4a6fa5;
            --accent-secondary: #2d4a7a;
            --accent-hover: #1e3560;
            --accent-ai: #4a6fa5;
            --border-color: #2a4080;
            --frame-color: #050a15;
            --text-main: #e8eaf6;
            --text-muted: #7986cb;
            --shadow-3d: 0 4px 0 rgba(0,10,40,0.4);
            --shadow-float: 0 10px 30px rgba(0,20,80,0.5);
        }

        body.movie-mode .cozy-overlay { background: radial-gradient(ellipse at 50% 30%, rgba(74,111,165,0.18) 0%, rgba(5,10,25,0.85) 100%) !important; }
        body.movie-mode .background-backdrop { filter: blur(40px) brightness(0.3) saturate(0.4) !important; }
        body.movie-mode .show-overview { border-left-color: #4a6fa5; background: rgba(74,111,165,0.1); }
        body.movie-mode .library-section { background: rgba(8,14,32,0.7); border-color: #2a4080; }
        body.movie-mode .badge { background: rgba(74,111,165,0.15); color: #a0b8e8; }
        body.movie-mode .badge.rating { background: rgba(106,90,205,0.18); color: #9fa8da; }
        body.movie-mode .dropdown-header { background-color: #2d4a7a; border-color: #3a5a9a; }
        body.movie-mode .search-results { background: rgba(8,14,32,0.98); border-color: #2a4080; }
        body.movie-mode .search-item:hover { background: rgba(74,111,165,0.2); }
        body.movie-mode .cinema-fx { display: block !important; opacity: 1 !important; z-index: -1; }
        body.movie-mode .zesty-msg-bot { background: #0e1830; border-color: #2a4080; color: #c5cae9; }
        body.movie-mode .zesty-header { background: #1a2d5a; }
        body.movie-mode .zesty-panel { background: #080e20; border-color: #2a4080; }
        body.movie-mode input, body.movie-mode .action-btn { background: #0e1830; border-color: #2a4080; color: #e8eaf6; }
        body.movie-mode input::placeholder { color: #7986cb; }
        body.movie-mode .ai-insights-panel { background: rgba(74,111,165,0.15); border-color: #2a4080; color: #e8eaf6; }
        body.movie-mode .show-info { background: rgba(8,14,32,0.88); border-color: #2a4080; }
        body.movie-mode .navbar { background: rgba(8,14,32,0.95); border-color: #2a4080; }
        body.movie-mode .library-title { color: #c5cae9; }
        body.movie-mode .empty-library { color: #7986cb; }
        body.movie-mode .library-card { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .library-card-title { color: #c5cae9; background: linear-gradient(180deg, #0e1a35, #0a1428); border-top-color: #1e3560; }
        body.movie-mode .dropdown-list { background: #0e1830; border-color: #2a4080; }
        body.movie-mode .dropdown-item:hover, body.movie-mode .dropdown-item.selected { background: rgba(74,111,165,0.25); color: #fff; }

        /* ── ANIMATIONS ── */
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 10px rgba(110,155,133,0.3), var(--shadow-3d); }
            50% { box-shadow: 0 0 20px rgba(110,155,133,0.7), var(--shadow-3d); }
        }
        @keyframes pulseGlowMovie {
            0%,100% { box-shadow: 0 0 10px rgba(74,111,165,0.3), var(--shadow-3d); }
            50% { box-shadow: 0 0 20px rgba(74,111,165,0.7), var(--shadow-3d); }
        }
        @keyframes popIn {
            from { opacity:0; transform: scale(0.95) translateY(-6px); }
            to { opacity:1; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(10px); }
            to { opacity:1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity:0; }
            to { opacity:1; }
        }
        @keyframes sweep {
            0% { transform: translateX(-50%) rotate(-12deg); opacity: 0.15; }
            50% { opacity: 0.4; }
            100% { transform: translateX(-50%) rotate(12deg); opacity: 0.15; }
        }
        @keyframes twinkleLayer {
            0% { opacity:0.3; transform: scale(0.8); }
            100% { opacity:1; transform: scale(1.2); }
        }
        @keyframes dots {
            0% { content:''; } 25% { content:'.'; } 50% { content:'..'; } 75% { content:'...'; }
        }
        @keyframes nfCtrlFadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito', system-ui, sans-serif; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; overflow-y:auto; font-size:16px; overscroll-behavior:none; transition: background-color 0.8s ease, color 0.6s ease; }
        body.chat-open { overflow:hidden !important; }
        body.chat-open #zesty-toggle { display:none !important; }

        /* ── BG FX ── */
        .cinema-fx { display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; pointer-events:none; overflow:hidden; opacity:0; transition:opacity 1s ease; }
        .cinema-beam { position:absolute; top:-20%; left:50%; width:250vw; height:150vh; background:conic-gradient(from 180deg at 50% 0%, rgba(95,140,205,0.25) 0deg, transparent 40deg, transparent 320deg, rgba(95,140,205,0.25) 360deg); transform-origin:top center; animation:sweep 10s infinite alternate ease-in-out; }
        .stars-layer1 { position:absolute; width:4px; height:4px; background:transparent; border-radius:50%; box-shadow: 10vw 20vh 0 #fff,20vw 80vh 0 #e8eaf6,30vw 40vh 0 #fff,40vw 90vh 0 #9fc3ff,50vw 10vh 0 #fff,60vw 60vh 0 #fff,70vw 30vh 0 #e8eaf6,80vw 70vh 0 #fff,90vw 50vh 0 #9fc3ff,15vw 60vh 0 #fff,25vw 15vh 0 #fff,35vw 75vh 0 #e8eaf6,45vw 25vh 0 #fff,55vw 85vh 0 #fff,65vw 5vh 0 #9fc3ff,75vw 95vh 0 #fff,85vw 45vh 0 #fff,95vw 80vh 0 #e8eaf6; animation:twinkleLayer 3s infinite alternate ease-in-out; }
        .stars-layer2 { position:absolute; width:3px; height:3px; background:transparent; border-radius:50%; box-shadow: 5vw 50vh 0 #fff,15vw 90vh 0 #e8eaf6,25vw 30vh 0 #fff,35vw 10vh 0 #9fc3ff,45vw 60vh 0 #fff,55vw 40vh 0 #fff,65vw 80vh 0 #fff,75vw 20vh 0 #fff,85vw 15vh 0 #9fc3ff,95vw 65vh 0 #fff; animation:twinkleLayer 2s infinite alternate-reverse ease-in-out; }
        .background-backdrop { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-3; background-size:cover; background-position:center; filter:blur(30px) brightness(0.8) sepia(0.3); transition:background-image 1s ease-in-out, filter 0.8s ease; transform:scale(1.1); }
        .cozy-overlay { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-2; background:radial-gradient(circle at 50% 50%, rgba(212,163,115,0.3) 0%, rgba(92,64,51,0.95) 100%); pointer-events:none; transition:background 0.8s ease; }

        /* ── LAYOUT ── */
        .main-content { flex:1; padding-bottom:50px; display:flex; flex-direction:column; align-items:center; gap:20px; width:100%; }
        .navbar, .show-info, .library-section { width:95%; max-width:1600px; margin:14px auto; }
        .navbar { display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background-color:var(--nav-bg); backdrop-filter:blur(20px); border:3px solid var(--border-color); border-radius:var(--bubbly-radius); box-shadow:var(--shadow-float), var(--shadow-3d); z-index:100; gap:20px; transition:background 0.8s ease, border-color 0.6s ease; }
        .nav-left { display:flex; align-items:center; gap:14px; flex-shrink:0; }
        .nav-right { flex:2; display:flex; justify-content:flex-end; align-items:center; }
        .logo { font-size:32px; font-weight:700; font-family:'Fredoka', sans-serif; display:flex; align-items:center; gap:4px; }

        input, textarea { background-color:var(--input-bg); color:var(--text-main); border:3px solid var(--border-color); padding:9px 18px; border-radius:var(--bubbly-radius); outline:none; font-size:16px !important; font-weight:800; transition:all 0.3s; box-shadow:var(--shadow-3d); width:100%; user-select:text !important; -webkit-user-select:text !important; }
        input::placeholder { color:#A1887F; font-weight:700; }
        input.ai-mode { border-color:var(--accent-ai); box-shadow:0 0 14px rgba(110,155,133,0.3), var(--shadow-3d); }
        body.movie-mode input.ai-mode { box-shadow:0 0 14px rgba(74,111,165,0.3), var(--shadow-3d); }
        input:hover { border-color:var(--accent-primary); }

        .action-btn { background-color:var(--accent-hover); color:var(--text-main); border:3px solid var(--border-color); padding:9px 18px; border-radius:var(--bubbly-radius); outline:none; font-size:16px !important; font-weight:800; transition:all 0.3s; box-shadow:var(--shadow-3d); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
        .action-btn:hover { transform:translateY(-2px); box-shadow:0 6px 0 rgba(62,39,35,0.18); }
        .action-btn:active { transform:translateY(1px); }
        .action-btn.active-fav { background-color:var(--danger); border-color:#B25858; color:white; }

        .search-container { display:flex; align-items:center; gap:8px; flex-grow:1; width:100%; max-width:650px; }
        .search-input-wrapper { position:relative; flex:1; }
        .search-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }
        .compact-circle { width:44px; height:44px; padding:0; border-radius:50%; display:flex !important; align-items:center !important; justify-content:center !important; flex-shrink:0; font-size:18px !important; }
        .compact-circle span { display:inline-flex; justify-content:center; align-items:center; line-height:1; }
        .ai-search-area { background:var(--nav-bg); border:3px solid var(--border-color); box-shadow:var(--shadow-3d); transition:all 0.3s; cursor:pointer; }
        .ai-search-area.active { border-color:var(--accent-ai); animation:pulseGlow 2.5s infinite; }
        body.movie-mode .ai-search-area.active { animation-name:pulseGlowMovie; }
        .ai-search-area .ai-search-icon { transition:transform 0.3s; font-size:20px; }
        .ai-search-area.active .ai-search-icon { transform:scale(1.15); }

        .search-results { position:absolute; top:calc(100% + 10px); left:0; width:100%; background-color:var(--nav-bg); border:3px solid var(--border-color); border-radius:var(--card-radius); box-shadow:var(--shadow-float); z-index:200; display:none; flex-direction:column; padding:8px; }
        .search-results.active { display:flex; animation:popIn 0.2s forwards; }
        .search-item { display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:12px; cursor:pointer; transition:background 0.2s; }
        .search-item:hover { background:var(--accent-hover); }
        .search-item img { width:36px; height:52px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#ddd; }
        .search-item b { font-size:14px; font-weight:800; color:var(--text-main); }
        .search-item small { font-size:12px; color:var(--text-muted); font-weight:700; }

        .dropdown-container { display:flex; gap:10px; align-items:center; }
        .custom-dropdown { position:relative; min-width:140px; }
        .dropdown-header { background-color:var(--accent-secondary); color:white; border:3px solid var(--border-color); padding:9px 16px; border-radius:var(--bubbly-radius); font-size:15px; font-weight:800; font-family:'Fredoka', sans-serif; cursor:pointer; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow-3d); transition:all 0.3s; }
        .dropdown-header:hover { transform:translateY(-2px); }
        .dropdown-header.disabled { opacity:0.55; pointer-events:none; filter:grayscale(0.5); }
        .dropdown-list { position:absolute; top:calc(100% + 8px); left:0; width:100%; background:var(--nav-bg); border:3px solid var(--border-color); border-radius:16px; box-shadow:var(--shadow-float); max-height:260px; overflow-y:auto; z-index:300; display:none; flex-direction:column; padding:8px; }
        .dropdown-list.show { display:flex; animation:popIn 0.2s forwards; }
        .dropdown-item { padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:900; font-size:14px; transition:all 0.2s; }
        .dropdown-item:hover, .dropdown-item.selected { background-color:var(--accent-hover); transform:translateX(4px); }

        /* ════════════════════════════════════════════
            NETFLIX-STYLE PLAYER WRAPPER
        ════════════════════════════════════════════ */
        .player-outer {
            width:95%; max-width:1600px;
            aspect-ratio:16/9;
            position:relative;
            margin-top:14px;
            border-radius:14px;
            overflow:hidden;
            background:#000;
            box-shadow:0 0 0 4px #1a0e0a, 0 0 60px rgba(0,0,0,0.8);
            transition:box-shadow 0.8s ease;
        }
        body.movie-mode .player-outer { box-shadow:0 0 0 4px #050a14, 0 0 60px rgba(74,111,165,0.35); }

        .player-outer iframe, .player-outer video {
            position:absolute; top:0; left:0; width:100%; height:100%; border:none; display:block; z-index:1;
        }

        .player-loading {
            position:absolute; inset:0; z-index:10;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:#000; gap:18px;
            transition:opacity 0.4s ease;
        }
        .player-loading.hidden { opacity:0; pointer-events:none; }
        .spinner-ring {
            width:52px; height:52px;
            border:4px solid rgba(255,255,255,0.1);
            border-top-color:var(--nf-accent);
            border-radius:50%;
            animation:spinRing 0.9s linear infinite;
        }
        .player-loading-text { color:rgba(255,255,255,0.55); font-size:13px; font-weight:800; letter-spacing:0.1em; }

        .nf-controls {
            position:absolute; bottom:0; left:0; right:0; z-index:20;
            background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            padding:18px 22px 16px;
            display:flex; flex-direction:column; gap:10px;
            opacity:1;
            transition:opacity 0.35s ease;
        }
        .nf-controls.hidden { opacity:0; pointer-events:none; }

        .nf-top-bar {
            display:flex; justify-content:space-between; align-items:flex-start;
            position:absolute; top:0; left:0; right:0;
            padding:18px 22px;
            background:linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
            z-index:20;
            opacity:1;
            transition:opacity 0.35s ease;
        }
        .nf-top-bar.hidden { opacity:0; pointer-events:none; }
        .nf-title-display { color:#fff; font-size:16px; font-weight:800; text-shadow:0 1px 6px rgba(0,0,0,0.8); max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .nf-ep-info { color:rgba(255,255,255,0.7); font-size:13px; font-weight:700; margin-top:2px; }

        .nf-source-pills { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
        .nf-source-pill {
            padding:5px 12px; border-radius:20px; font-size:12px; font-weight:900;
            border:1.5px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.7);
            cursor:pointer; background:rgba(0,0,0,0.4); transition:all 0.2s; letter-spacing:0.04em;
        }
        .nf-source-pill:hover { background:rgba(255,255,255,0.15); color:#fff; }
        .nf-source-pill.active { background:var(--nf-accent); border-color:var(--nf-accent); color:#fff; }

        .nf-progress-row { display:flex; align-items:center; gap:12px; }
        .nf-time { color:rgba(255,255,255,0.8); font-size:12px; font-weight:800; white-space:nowrap; min-width:38px; }
        .nf-seekbar {
            flex:1; height:4px; background:rgba(255,255,255,0.25); border-radius:4px;
            cursor:pointer; position:relative; transition:height 0.15s;
        }
        .nf-seekbar:hover { height:6px; }
        .nf-seekbar-fill { height:100%; background:var(--nf-accent); border-radius:4px; width:0%; transition:width 0.5s linear; pointer-events:none; }
        .nf-seekbar-handle { position:absolute; top:50%; right:-6px; transform:translateY(-50%); width:14px; height:14px; background:#fff; border-radius:50%; opacity:0; transition:opacity 0.2s; pointer-events:none; box-shadow:0 0 6px rgba(0,0,0,0.6); }
        .nf-seekbar:hover .nf-seekbar-handle { opacity:1; }

        .nf-main-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .nf-left-controls, .nf-right-controls { display:flex; align-items:center; gap:6px; }

        .nf-btn {
            background:none; border:none; color:#fff; cursor:pointer;
            width:38px; height:38px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:18px; transition:background 0.2s, transform 0.15s;
            position:relative;
        }
        .nf-btn:hover { background:rgba(255,255,255,0.15); transform:scale(1.12); }
        .nf-btn:active { transform:scale(0.96); }
        .nf-btn svg { width:20px; height:20px; fill:currentColor; pointer-events:none; }
        .nf-btn.active { color:var(--nf-accent); }

        .nf-vol-wrap { display:flex; align-items:center; gap:6px; }
        .nf-vol-slider {
            width:0; overflow:hidden; transition:width 0.25s ease;
            display:flex; align-items:center;
        }
        .nf-vol-wrap:hover .nf-vol-slider, .nf-vol-slider:focus-within { width:72px; }
        .nf-vol-slider input[type=range] {
            width:72px; height:4px; -webkit-appearance:none; appearance:none;
            background:rgba(255,255,255,0.3); border-radius:4px; outline:none;
            border:none; box-shadow:none; padding:0; cursor:pointer;
        }
        .nf-vol-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; background:#fff; border-radius:50%; cursor:pointer; }

        .nf-settings-panel {
            position:absolute; bottom:80px; right:16px; z-index:50;
            background:var(--nf-panel-bg); border:1px solid var(--nf-border);
            border-radius:12px; padding:0; min-width:220px;
            box-shadow:0 8px 32px rgba(0,0,0,0.7);
            display:none; flex-direction:column; overflow:hidden;
            animation:popIn 0.18s forwards;
        }
        .nf-settings-panel.open { display:flex; }
        .nf-panel-header {
            padding:12px 16px; font-size:13px; font-weight:900; color:rgba(255,255,255,0.5);
            letter-spacing:0.08em; text-transform:uppercase; border-bottom:1px solid var(--nf-border);
            display:flex; align-items:center; justify-content:space-between;
        }
        .nf-panel-back { color:rgba(255,255,255,0.5); cursor:pointer; font-size:18px; line-height:1; transition:color 0.2s; }
        .nf-panel-back:hover { color:#fff; }
        .nf-panel-opt {
            padding:11px 16px; font-size:14px; font-weight:800; color:#fff;
            cursor:pointer; display:flex; align-items:center; justify-content:space-between;
            transition:background 0.15s; gap:10px;
        }
        .nf-panel-opt:hover { background:rgba(255,255,255,0.08); }
        .nf-panel-opt .opt-val { color:rgba(255,255,255,0.5); font-size:13px; font-weight:700; }
        .nf-panel-opt.selected .opt-val, .nf-panel-opt.selected { color:#fff; }
        .nf-panel-opt.selected::before { content:'✓'; color:var(--nf-accent); margin-right:4px; font-weight:900; }
        .nf-opt-check { width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); flex-shrink:0; transition:all 0.2s; }
        .nf-panel-opt.selected .nf-opt-check { background:var(--nf-accent); border-color:var(--nf-accent); }
        .nf-panel-divider { height:1px; background:var(--nf-border); margin:2px 0; }
        .nf-panel-section-label { padding:10px 16px 4px; font-size:11px; font-weight:900; color:rgba(255,255,255,0.35); letter-spacing:0.1em; text-transform:uppercase; }

        .nf-sub-search { padding:10px 12px; border-bottom:1px solid var(--nf-border); display:flex; gap:6px; }
        .nf-sub-search input {
            flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#fff;
            padding:7px 12px; border-radius:8px; font-size:13px; font-weight:700;
            outline:none; box-shadow:none; width:auto;
        }
        .nf-sub-search input::placeholder { color:rgba(255,255,255,0.35); }
        .nf-sub-search-btn {
            background:var(--nf-accent); border:none; color:#fff; padding:7px 12px;

async function searchOpenSubtitles(query) {
    try {
        const url = `https://api.opensubtitles.com/api/v1/subtitles?query=${encodeURIComponent(query)}&languages=en&per_page=10`;
        const res = await fetch(url, { headers: { 'Api-Key': 'HJ1gzJRkN2GLoXAv8nU8aFPMJJzEkqh2', 'Content-Type': 'application/json' } });
        if (!res.ok) return fallbackSubResults(query);
        const data = await res.json();
        return (data.data || []).slice(0, 8).map(item => ({
            flag: langToFlag(item.attributes.language),
            name: item.attributes.release || item.attributes.feature_details?.movie_name || query,
            lang: item.attributes.language,
            url: item.attributes.files?.[0]?.file_id ? `https://dl.opensubtitles.com/en/download/file/${item.attributes.files[0].file_id}` : null,
            source: 'OpenSubtitles'
        }));
    } catch { return fallbackSubResults(query); }
}

function fallbackSubResults(query) {
    const langs = [
        { code:'en', flag:'🇬🇧', name:'English' },
        { code:'es', flag:'🇪🇸', name:'Spanish' },
        { code:'fr', flag:'🇫🇷', name:'French' },
        { code:'de', flag:'🇩🇪', name:'German' },
        { code:'he', flag:'🇮🇱', name:'Hebrew' },
        { code:'pt', flag:'🇧🇷', name:'Portuguese' },
        { code:'ar', flag:'🇸🇦', name:'Arabic' },
        { code:'ru', flag:'🇷🇺', name:'Russian' },
    ];
    return langs.map(l => ({
        flag: l.flag, name: `${query} — ${l.name}`, lang: l.code,
        url: `https://subscene.com/subtitles/searchbytitle?query=${encodeURIComponent(query)}&l=${l.code}`,
        source: 'Subscene'
    }));
}

function langToFlag(code) {
    const m = { en:'🇬🇧', es:'🇪🇸', fr:'🇫🇷', de:'🇩🇪', it:'🇮🇹', pt:'🇧🇷', ru:'🇷🇺', ar:'🇸🇦', he:'🇮🇱', zh:'🇨🇳', ja:'🇯🇵', ko:'🇰🇷', nl:'🇳🇱', pl:'🇵🇱', tr:'🇹🇷', sv:'🇸🇪', no:'🇳🇴', da:'🇩🇰' };

}

function formatTime(s) {
    if (isNaN(s)) return "0:00";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
}

async function buildSubPanel(query = mediaTitle) {
    const el = $('nf-sub-opts');
    el.innerHTML = '<div class="nf-sub-empty">Searching subtitles...</div>';
    try {
        const results = await searchOpenSubtitles(query);
        el.innerHTML = '';
        const none = document.createElement('div');
        none.className = 'nf-sub-result' + (!activeSub ? ' active-sub' : '');
        none.innerHTML = `<span class="sub-flag">🚫</span><span class="sub-name">Off</span>`;
        none.onclick = () => { activeSub = null; buildSubPanel(query); showToast('Subtitles off'); };
        el.appendChild(none);
        if (!results.length) { el.innerHTML += '<div class="nf-sub-empty">No subtitles found. Try a different search.</div>'; return; }
        results.forEach(r => {
            const row = document.createElement('div');
            row.className = 'nf-sub-result' + (activeSub === r.url ? ' active-sub' : '');
            row.innerHTML = `<span class="sub-flag">${r.flag}</span><span class="sub-name">${r.name}</span><span class="sub-src">${r.source}</span>`;
            row.onclick = () => {
                activeSub = r.url;
                if (r.url && r.url.startsWith('http')) { window.open(r.url, '_blank'); }
                buildSubPanel(query);
                showToast(`Subtitle: ${r.name.slice(0,30)}`);

            el.appendChild(row);
        });
    } catch { el.innerHTML = '<div class="nf-sub-empty">Failed to load. Check connection.</div>'; }
}

function updateSeekbar() {
    nfTimeElapsed.textContent = formatTime(playbackSeconds);
    if (playbackTotal > 0) {
        const pct = Math.min(100, (playbackSeconds / playbackTotal) * 100);
        nfSeekbarFill.style.width = pct + '%';
        nfSeekbarFill.parentElement.querySelector('.nf-seekbar-handle').style.left = `calc(${pct}% - 6px)`;
    }
}

$('nf-seekbar').addEventListener('click', e => {
    if (!playbackTotal) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    playbackSeconds = Math.round(pct * playbackTotal);
    updateSeekbar();
    
    if (SOURCES[activeSourceIdx].id === 'hf_primary') {
        playerVideo.currentTime = playbackSeconds;
    } else {
        try { playerFrame.contentWindow.document.querySelectorAll('video').forEach(v => v.currentTime = playbackSeconds); } catch(e) {}
    }
});

playerVideo.addEventListener('timeupdate', () => {

    playbackSeconds = Math.floor(playerVideo.currentTime);
    playbackTotal = Math.floor(playerVideo.duration) || 0;
    updateSeekbar();
    nfTimeTotal.textContent = formatTime(playbackTotal);
});

    if (type === 'movie') { document.body.classList.add('movie-mode'); $('theme-icon').textContent = '🌙'; }
    else { document.body.classList.remove('movie-mode'); $('theme-icon').textContent = '☕'; }
}

$('theme-switch').addEventListener('click', () => {
    document.body.classList.toggle('movie-mode');
    userManualTheme = document.body.classList.contains('movie-mode') ? 'movie' : 'cafe';
    $('theme-icon').textContent = document.body.classList.contains('movie-mode') ? '🌙' : '☕';
});

async function updatePlayer() {
    playerLoading.classList.remove('hidden');
    isPlaying = false;
    playbackSeconds = 0;
    nfSeekbarFill.style.width = '0%';
    $('nf-playpause').innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    
    nfTitleDisplay.textContent = mediaTitle || '—';
    if (mediaType === 'tv' && seasonVal && episodeVal) {
        nfEpInfo.textContent = `S${seasonVal} · E${episodeVal}`;
    } else {
        nfEpInfo.textContent = mediaYear || '';
    }
    nfTimeTotal.textContent = '—';
    buildSourcePills();

    const src = SOURCES[activeSourceIdx];

    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

    if (src.id === 'hf_primary') {
        playerFrame.style.display = 'none';
        playerVideo.style.display = 'block';
        nfControls.classList.remove('hidden');

        try {
            const url = src.buildUrl(mediaType, mediaId, seasonVal, episodeVal);
            const res = await fetch(url);
            const data = await res.json();

            if (data.success && data.streams && data.streams.length > 0) {
                const streamUrl = data.streams[0].url;
                if (Hls.isSupported() && streamUrl.includes('m3u8')) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(streamUrl);
                    hlsInstance.attachMedia(playerVideo);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        playerLoading.classList.add('hidden');
                        playerVideo.play();
                        isPlaying = true;
                        $('nf-playpause').innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
                    });
                } else {
                    playerVideo.src = streamUrl;
                    playerVideo.addEventListener('loadedmetadata', () => {
                        playerLoading.classList.add('hidden');
                        playerVideo.play();
                    });
                }
            } else {
                playerLoading.classList.add('hidden');
                nfTitleDisplay.textContent = "Error: No streams found.";
            }
        } catch (e) {
            playerLoading.classList.add('hidden');
            nfTitleDisplay.textContent = "Error: Failed to connect.";
        }
    } else {
        playerVideo.style.display = 'none';
        playerVideo.pause();
        playerFrame.style.display = 'block';
        nfControls.classList.add('hidden');

        playerFrame.src = src.buildUrl(mediaType, mediaId, seasonVal, episodeVal);
        playerFrame.onload = () => { playerLoading.classList.add('hidden'); };
    }
}

const getLib = () => JSON.parse(localStorage.getItem('streamToyLibrary') || '[]');
const saveLib = lib => { localStorage.setItem('streamToyLibrary', JSON.stringify(lib)); renderLib(); updateFavUI(); };

function upsertLib(data, type, season = 1, episode = 1) {
    let lib = getLib();
    const existing = lib.find(i => i.id == data.id && i.mediaType === type);
    const isFav = existing ? existing.favorite : false;
    lib = lib.filter(i => !(i.id == data.id && i.mediaType === type));
    lib.unshift({ id: data.id, name: data.name || data.title, poster: data.poster_path, mediaType: type, season, episode, favorite: isFav });
    if (lib.length > 20) lib.pop();
    saveLib(lib);
}

function toggleFav(id) {
    let lib = getLib();
    const idx = lib.findIndex(x => x.id == id && x.mediaType === mediaType);
    if (idx !== -1) { lib[idx].favorite = !lib[idx].favorite; saveLib(lib); }
}

function updateFavUI() {
    const cur = getLib().find(i => i.id == mediaId && i.mediaType == mediaType);
    const btn = $('fav-btn');
    if (cur?.favorite) { btn.innerHTML = '<span style="color:#ef4444;">❤️</span> Favorited'; btn.classList.add('active-fav'); }
    else { btn.innerHTML = '<span>🤍</span> Favorite'; btn.classList.remove('active-fav'); }
}

function renderLib() {
    const scroll = $('library-scroll');
    const lib = getLib();
    scroll.innerHTML = '';
    if (!lib.length) { scroll.innerHTML = '<div class="empty-library">Backpack empty! 🏕️ Search to start.</div>'; return; }
    lib.sort((a, b) => (b.favorite === true) - (a.favorite === true));
    lib.forEach(item => {
        const card = document.createElement('div');
        card.className = `library-card ${item.favorite ? 'is-favorite' : ''}`;
        const posterUrl = item.poster ? `https://image.tmdb.org/t/p/w200${item.poster}` : '';
        const favB = item.favorite ? '<div class="fav-badge">❤️</div>' : '';
        const progB = item.mediaType === 'movie' ? `<div class="progress-badge is-movie">🎬 FILM</div>` : `<div class="progress-badge">S${item.season||1} · E${item.episode||1}</div>`;
        card.innerHTML = `<div class="remove-btn" title="Remove">✕</div><div class="card-img-wrapper">${favB}<img src="${posterUrl}" loading="lazy">${progB}</div><div class="library-card-title">${item.name}</div>`;
        card.querySelector('.remove-btn').onclick = e => { e.stopPropagation(); saveLib(getLib().filter(i => !(i.id == item.id && i.mediaType === item.mediaType))); };
        card.onclick = () => { loadMedia(item.id, item.mediaType, item.season, item.episode); window.scrollTo({top:0, behavior:'smooth'}); };
        scroll.appendChild(card);
    });
}

const seasonHeader = $('season-header'), seasonList = $('season-list');
const episodeHeader = $('episode-header'), episodeList = $('episode-list');

function toggleDD(list) {
    if (list !== seasonList) seasonList.classList.remove('show');
    if (list !== episodeList) episodeList.classList.remove('show');
    list.classList.toggle('show');
}
seasonHeader.onclick = () => { if (!seasonHeader.classList.contains('disabled')) toggleDD(seasonList); };
episodeHeader.onclick = () => { if (!episodeHeader.classList.contains('disabled')) toggleDD(episodeList); };
document.onclick = e => {
    if (!e.target.closest('.custom-dropdown')) { seasonList.classList.remove('show'); episodeList.classList.remove('show'); }
    if (!e.target.closest('.search-container')) searchResults.classList.remove('active');
};

function buildSeasonDD(seasons, tar) {
    seasonList.innerHTML = '';
    seasons.forEach(s => {
        const el = document.createElement('div'); el.className = 'dropdown-item';
        el.textContent = `Season ${s.season_number}`;
        if (s.season_number == tar) el.classList.add('selected');
        el.onclick = () => { seasonVal = s.season_number; seasonHeader.innerHTML = `Season ${seasonVal} <span>▼</span>`; seasonList.classList.remove('show'); loadEpisodes(mediaId, seasonVal); };
        seasonList.appendChild(el);
    });
    seasonHeader.classList.remove('disabled');

function buildEpisodeDD(eps, tar) {
    episodeList.innerHTML = '';
    eps.forEach(ep => {
        const el = document.createElement('div'); el.className = 'dropdown-item';
        const name = ep.name.length > 24 ? ep.name.slice(0, 24) + '…' : ep.name;
        el.textContent = `Ep ${ep.episode_number}: ${name}`;
        if (ep.episode_number == tar) el.classList.add('selected');
        el.onclick = () => { episodeVal = ep.episode_number; episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`; episodeList.classList.remove('show'); updatePlayer(); };
        episodeList.appendChild(el);
    });
    episodeHeader.classList.remove('disabled');
}

async function loadEpisodes(id, sNum, tar = null) {
    const data = await TMDB.getEpisodes(id, sNum);
    if (data.episodes?.length) {
        episodeVal = tar || data.episodes[0].episode_number;
        episodeHeader.innerHTML = `Ep ${episodeVal} <span>▼</span>`;
        buildEpisodeDD(data.episodes, episodeVal);
        updatePlayer();
    }
}

function truncateOverview(text) {
    if (!text) return 'No story available.';
    if (text.length <= 160) return text;
    return `<span class="short-desc">${text.slice(0, 160)}...</span><span class="full-desc" style="display:none;">${text}</span><a href="#" class="read-more-btn"> Read More</a>`;
}

function mdToHtml(raw) {
    if (!raw) return '';
    let t = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
    const lines = t.split('\n'); let html = '', inList = false;
    for (const line of lines) {
        const bm = line.match(/^[\*\-]\s+(.+)/);
        if (bm) { if (!inList) { html += '<ul style="padding-left:22px;margin:8px 0;">'; inList = true; } html += `<li style="margin-bottom:6px;">${bm[1]}</li>`; }
        else { if (inList) { html += '</ul>'; inList = false; } if (line.trim()) html += `<p style="margin-bottom:12px;">${line.trim()}</p>`; }
    }
    if (inList) html += '</ul>';
    return html;
}

const aiInsightsPanel = $('ai-insights-panel');
const infoTitle = $('info-title'), infoYear = $('info-year'), infoRating = $('info-rating');
const infoType = $('info-type'), infoOverview = $('info-overview'), badgesRow = $('badges-container');

async function loadMedia(id, type, tSeason = null, tEp = null) {
    mediaId = id; mediaType = type; currentInsightId = id;
    try {
        if (!userManualTheme) applyTheme(type);
        const details = await TMDB.getDetails(id, type);
        upsertLib(details, type, tSeason || 1, tEp || 1);
        if (details.backdrop_path && window.innerWidth > 768) {
            $('bg-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${details.backdrop_path})`;
        }
        mediaTitle = details.name || details.title;
        const releaseDate = details.first_air_date || details.release_date;
        mediaYear = releaseDate ? releaseDate.slice(0, 4) : 'N/A';
        infoTitle.textContent = mediaTitle;
        infoType.innerHTML = `<span>${type === 'movie' ? '🎬' : '📺'}</span> ${type === 'movie' ? 'Movie' : 'TV Show'}`;
        infoYear.innerHTML = `<span>📅</span> ${mediaYear}`;
        infoRating.innerHTML = `<span>⭐</span> ${details.vote_average?.toFixed(1) || 'N/A'}`;
        infoOverview.innerHTML = truncateOverview(details.overview);
        const readBtn = infoOverview.querySelector('.read-more-btn');
        if (readBtn) {
            readBtn.onclick = e => {
                e.preventDefault();
                const isS = infoOverview.querySelector('.full-desc').style.display === 'none';
                infoOverview.querySelector('.short-desc').style.display = isS ? 'none' : 'inline';
                infoOverview.querySelector('.full-desc').style.display = isS ? 'inline' : 'none';
                e.target.textContent = isS ? ' Show Less' : ' Read More';
            };
        }
        document.querySelectorAll('.genre-badge').forEach(e => e.remove());
        details.genres?.slice(0, 3).forEach(g => {
            const span = document.createElement('span'); span.className = 'badge genre-badge';
            span.innerHTML = `<span>🎭</span> ${g.name}`; badgesRow.appendChild(span);
        });
        if (type === 'movie') {
            $('dropdown-group').style.display = 'none';
            updatePlayer();
        } else {
            $('dropdown-group').style.display = 'flex';
            const valid = details.seasons?.filter(s => s.season_number > 0) || [];
            if (valid.length) {
                seasonVal = tSeason || valid[0].season_number;
                $('season-header').innerHTML = `Season ${seasonVal} <span>▼</span>`;
                buildSeasonDD(valid, seasonVal);
                await loadEpisodes(id, seasonVal, tEp);
            }
        }
        updateFavUI();
        aiInsightsPanel.classList.remove('visible');
        $('insights-content').innerHTML = '<em style="opacity:0.75;font-weight:800;">💡 Fetching deep intelligence...</em>';
        setTimeout(() => {
            aiInsightsPanel.classList.add('visible');
            AI.insights(mediaTitle, type === 'tv' ? 'TV Show' : 'Movie', mediaYear).then(res => {
                if (currentInsightId === id) $('insights-content').innerHTML = mdToHtml(res);
            }).catch(() => {
                if (currentInsightId === id) $('insights-content').innerHTML = '<em>Failed to load deep intel.</em>';
            });
        }, 800);
    } catch(e) {}
}

$('close-insights').addEventListener('click', () => aiInsightsPanel.classList.remove('visible'));
$('fav-btn').onclick = () => toggleFav(mediaId);
$('share-btn').onclick = () => {
    const text = `Watching ${mediaTitle} on ZestFlix! 🍿`;
    if (navigator.share) navigator.share({ title:'ZestFlix', text });
    else { navigator.clipboard?.writeText(text); alert('Copied to clipboard! 🍿'); }

$('ai-recs-btn').addEventListener('click', async () => {
    $('ai-recs-btn').classList.toggle('active');
    const container = $('ai-recs-container');
    if (container.style.display === 'block') { container.style.display = 'none'; return; }
    const lib = getLib();
    if (!lib.length) return alert('Backpack empty! Add items first 🎒');
    container.style.display = 'block';
    $('ai-recs-scroll').innerHTML = '<div class="empty-library">🎯 Cooking up bangers...</div>';
    const titles = await AI.recs(lib.map(i => i.name).slice(0, 10));
    $('ai-recs-scroll').innerHTML = '';
    for (const title of titles) {
        const data = await TMDB.searchMulti(title);
        const res = data.results?.find(x => x.media_type === 'movie' || x.media_type === 'tv');
        if (!res) continue;
        const card = document.createElement('div'); card.className = 'library-card';
        const pUrl = res.poster_path ? `https://image.tmdb.org/t/p/w200${res.poster_path}` : '';
        const badge = res.media_type === 'movie' ? `<div class="progress-badge is-movie">🎬 FILM</div>` : `<div class="progress-badge">TV Show</div>`;
        card.innerHTML = `<div class="card-img-wrapper"><img src="${pUrl}" loading="lazy">${badge}</div><div class="library-card-title">${res.name || res.title}</div>`;
        card.onclick = () => { loadMedia(res.id, res.media_type); window.scrollTo({top:0, behavior:'smooth'}); };
        $('ai-recs-scroll').appendChild(card);
    }
});

const zestyToggle = $('zesty-toggle'), zestyPanel = $('zesty-panel');
const zestyMessages = $('zesty-messages'), zestyInput = $('zesty-input'), zestySend = $('zesty-send');

const adjustChatWindow = () => {
    if (!zestyPanel.classList.contains('open') || window.innerWidth > 768) {
        zestyPanel.style.position = ''; zestyPanel.style.height = ''; zestyPanel.style.top = ''; return;
    }
    if (window.visualViewport) {
        zestyPanel.style.position = 'absolute';
        zestyPanel.style.height = `${window.visualViewport.height}px`;
        zestyPanel.style.top = `${window.visualViewport.offsetTop}px`;
        window.scrollTo(0, 0);
    }
};
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', adjustChatWindow);
    window.visualViewport.addEventListener('scroll', adjustChatWindow);
}
zestyInput.addEventListener('focus', () => setTimeout(() => { zestyMessages.scrollTop = zestyMessages.scrollHeight; }, 300));

function toggleChat() {
    if (zestyPanel.classList.contains('open')) {
        zestyPanel.classList.remove('open'); document.body.classList.remove('chat-open');
        zestyPanel.style.position = ''; zestyPanel.style.height = ''; zestyPanel.style.top = '';
    } else {
        zestyPanel.classList.add('open'); document.body.classList.add('chat-open');
        adjustChatWindow(); zestyMessages.scrollTop = zestyMessages.scrollHeight;
    }
}

zestyToggle.addEventListener('click', toggleChat);
$('zesty-close').addEventListener('click', toggleChat);

async function parseAndRenderReply(reply) {
    const re = /\[RECOMMEND:\s*([^\]]+)\]/gi;
    const fragments = []; let last = 0, m;
    while ((m = re.exec(reply)) !== null) {
        const bText = reply.slice(last, m.index).trim();
        if (bText) fragments.push({ type:'text', content:bText });
        fragments.push({ type:'card', title: m[1].replace(/\s*\([^)]*\)/g,'').trim() });
        last = m.index + m[0].length;
    }
    const aText = reply.slice(last).trim();
    if (aText) fragments.push({ type:'text', content:aText });
    if (!fragments.length) fragments.push({ type:'text', content:reply });
    for (const f of fragments) {
        if (f.type === 'text') {
            const el = document.createElement('div'); el.className = 'zesty-msg-bot'; el.innerHTML = mdToHtml(f.content) || f.content;
            zestyMessages.appendChild(el);
        } else {
            const data = await TMDB.searchMulti(f.title);
            const r = data.results?.find(x => x.media_type === 'movie' || x.media_type === 'tv');
            if (r) {
                const c = document.createElement('div'); c.className = 'zesty-canvas-card';
                const p = r.poster_path ? `https://image.tmdb.org/t/p/w300${r.poster_path}` : '';
                c.innerHTML = `${p ? `<img class="canvas-card-img" src="${p}">` : ''}<div class="canvas-card-body"><div class="canvas-card-title">${r.name || r.title}</div><div class="canvas-card-meta">${r.media_type === 'movie' ? '🎬 Movie' : '📺 TV Show'} · ⭐ ${r.vote_average?.toFixed(1) || '?'}</div></div>`;
                c.onclick = () => { loadMedia(r.id, r.media_type); toggleChat(); window.scrollTo({top:0, behavior:'smooth'}); };
                zestyMessages.appendChild(c);
            }
        }
    }
    zestyMessages.scrollTop = zestyMessages.scrollHeight;
}

async function sendZesty() {
    const text = zestyInput.value.trim(); if (!text) return;
    const usr = document.createElement('div'); usr.className = 'zesty-msg-user'; usr.textContent = text;
    zestyMessages.appendChild(usr); zestyInput.value = '';
    chatHistory.push({ role:'user', content:text }); zestyMessages.scrollTop = zestyMessages.scrollHeight;
    const think = document.createElement('div'); think.className = 'zesty-msg-bot thinking-dots'; think.textContent = 'Typing';
    zestyMessages.appendChild(think); zestyMessages.scrollTop = zestyMessages.scrollHeight;
    const reply = await AI.chat(chatHistory);
    think.remove();
    chatHistory.push({ role:'assistant', content:reply });
    await parseAndRenderReply(reply);
}

zestySend.onclick = sendZesty;
zestyInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendZesty(); } };

window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'PLAYER_EVENT') {
        const d = event.data.data;
        if (d.duration && !isNaN(d.duration)) {
            playbackTotal = Math.floor(d.duration);
            nfTimeTotal.textContent = formatTime(playbackTotal);
        }
        if (d.currentTime !== undefined) {
            playbackSeconds = Math.floor(d.currentTime);
            updateSeekbar();
        }
    }
});

renderLib();
loadMedia(mediaId, mediaType);
buildSourcePills();
